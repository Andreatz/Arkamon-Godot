<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
  <defs>
    <!-- Gradiente Vetro Cilindrico Nero -->
    <linearGradient id="tube-glass-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.65"/>
      <stop offset="18%" stop-color="#475569" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#020617" stop-opacity="0.15"/>
      <stop offset="82%" stop-color="#475569" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="cap-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="cyan-neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#64748b" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- ==================== 1. CAPSULA DI CONTENIMENTO STARTER ==================== -->
  <g transform="translate(25, 10)">
    <!-- Bagliore Pavimento + Base Metallica Cilindrica -->
    <ellipse cx="105" cy="262" rx="88" ry="22" fill="#020617" stroke="#64748b" stroke-width="3" filter="url(#cyan-neon)"/>
    <path d="M 25 235 L 185 235 L 192 262 C 192 276 18 276 18 262 Z" fill="url(#cap-metal)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="105" cy="235" rx="80" ry="18" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
    <ellipse cx="105" cy="235" rx="64" ry="12" fill="#e2e8f0" filter="url(#cyan-neon)"/>

    <!-- Cilindro di Vetro Traslucido (Sovrapposto allo Sprite) -->
    <path d="M 28 48 L 28 235 C 28 250 182 250 182 235 L 182 48 Z" fill="url(#tube-glass-cyan)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Riflessi Verticali del Vetro Curvo -->
    <rect x="38" y="52" width="12" height="180" fill="#ffffff" opacity="0.28"/>
    <rect x="56" y="52" width="4" height="180" fill="#ffffff" opacity="0.15"/>
    <rect x="162" y="52" width="8" height="180" fill="#e2e8f0" opacity="0.22"/>

    <!-- Bolle di Sospensione Olografiche -->
    <circle cx="52" cy="195" r="7" fill="none" stroke="#e2e8f0" stroke-width="1.8" opacity="0.75"/>
    <circle cx="68" cy="165" r="4" fill="#f1f5f9" opacity="0.6"/>
    <circle cx="155" cy="182" r="9" fill="none" stroke="#e2e8f0" stroke-width="1.8" opacity="0.75"/>
    <circle cx="142" cy="135" r="5" fill="none" stroke="#e2e8f0" stroke-width="1.5" opacity="0.65"/>
    <circle cx="48" cy="110" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.5" opacity="0.5"/>

    <!-- Calotta Metallica Superiore + Luce Interna -->
    <path d="M 20 28 C 20 12 190 12 190 28 L 186 52 C 186 66 24 66 24 52 Z" fill="url(#cap-metal)" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="105" cy="52" rx="76" ry="14" fill="#64748b" stroke="#f1f5f9" stroke-width="2" filter="url(#cyan-neon)"/>
    <ellipse cx="105" cy="52" rx="55" ry="8" fill="#ffffff"/>

    <!-- Targhetta Starter Frontale ("VYRATH - NORMALE") -->
    <g transform="translate(22, 248)">
      <rect x="0" y="0" width="166" height="78" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
      <rect x="5" y="5" width="156" height="30" rx="3" fill="#1e293b"/>
      <!-- Sotto-barra Elemento -->
      <rect x="5" y="39" width="156" height="34" rx="3" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="56" r="11" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="142" cy="56" r="11" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    </g>
  </g>
</svg>