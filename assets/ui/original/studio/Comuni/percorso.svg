<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%" height="100%">
  <defs>
    <filter id="dropShadow10" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="textShadow10" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Bronzo / Oro Rosa Metallico 3D -->
    <linearGradient id="bronzeFrame10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e6"/>
      <stop offset="25%" stop-color="#e6ccb2"/>
      <stop offset="50%" stop-color="#b08968"/>
      <stop offset="75%" stop-color="#7f5539"/>
      <stop offset="100%" stop-color="#ddb892"/>
    </linearGradient>

    <linearGradient id="bronzeDark10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="50%" stop-color="#8c6246"/>
      <stop offset="100%" stop-color="#2b1b11"/>
    </linearGradient>

    <!-- Interno Placca Principale Ardesia Scuro -->
    <linearGradient id="mainSlate10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111822"/>
      <stop offset="50%" stop-color="#223042"/>
      <stop offset="100%" stop-color="#141d29"/>
    </linearGradient>

    <!-- Sotto-Pannello Trapezoidale -->
    <linearGradient id="subPanel10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16202c"/>
      <stop offset="85%" stop-color="#233547"/>
      <stop offset="100%" stop-color="#3b5266"/>
    </linearGradient>

    <!-- Gradiente Testo 3D "PERCORSO 1" -->
    <linearGradient id="titleGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Fregio Angolare e Gemma Laterale (Sinistro) -->
    <g id="sideFlange10">
      <!-- Ala Metallica Esterna Superiore e Inferiore -->
      <path d="M 140,36 L 100,20 L 82,42 C 62,48 48,65 40,86 L 16,106 L 40,126 C 48,147 62,164 82,170 L 100,192 L 140,176 L 96,172 L 52,106 L 96,40 Z" 
            fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="1.5"/>
      <!-- Castone Romboidale Laterale -->
      <polygon points="48,80 76,106 48,132 20,106" fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="1.5"/>
      <polygon points="48,87 68,106 48,125 28,106" fill="#1e1b2e" stroke="#e6ccb2" stroke-width="1"/>
      <!-- Gemma Ciano Interna -->
      <polygon points="48,94 60,106 48,118 36,106" fill="#38bdf8"/>
      <polygon points="48,98 55,106 48,114 41,106" fill="#e0f2fe"/>
      <!-- Piccolo Rombo Decorativo Interno -->
      <polygon points="88,98 96,106 88,114 80,106" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="88" cy="106" r="2" fill="#38bdf8"/>
    </g>
  </defs>

  <g filter="url(#dropShadow10)">
    <!-- 1. SOTTO-PANNELLO TRAPEZOIDALE ("2 AZIONI RIMASTE") -->
    <g>
      <!-- Bordo Metallico Esterno Sotto-pannello -->
      <polygon points="155,172 765,172 695,248 225,248" fill="#526d82" stroke="#0f172a" stroke-width="2"/>
      <!-- Riempimento Scuro Sotto-pannello -->
      <polygon points="164,172 756,172 690,242 230,242" fill="url(#subPanel10)"/>
      <!-- Ombra Proiettata dalla Placca Superiore -->
      <polygon points="164,172 756,172 746,184 174,184" fill="#000000" opacity="0.5"/>
      <!-- Testo "2 AZIONI RIMASTE" -->
      <text x="460" y="224" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="#cbd5e1" filter="url(#textShadow10)">2 AZIONI RIMASTE</text>
    </g>

    <!-- 2. PLACCA PRINCIPALE SUPERIORE ("PERCORSO 1") -->
    <g>
      <!-- Punte della Corona Superiore Centrale -->
      <polygon points="380,40 398,22 414,40" fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="1.5"/>
      <polygon points="506,40 522,22 540,40" fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="1.5"/>

      <!-- Cornice Principale Esterna Bronzo/Oro Rosa -->
      <polygon points="94,38 826,38 872,106 826,174 94,174 48,106" fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="2"/>
      
      <!-- Scanalatura Metallica Scura 3D -->
      <polygon points="100,45 820,45 862,106 820,167 100,167 58,106" fill="url(#bronzeDark10)"/>

      <!-- Cornice Interna Smussata Chiara -->
      <polygon points="105,50 815,50 854,106 815,162 105,162 66,106" fill="url(#mainSlate10)" stroke="url(#bronzeFrame10)" stroke-width="3"/>

      <!-- Pattern Geometrico Sottile Interno -->
      <g stroke="#334155" stroke-width="1" opacity="0.35">
        <line x1="140" y1="52" x2="210" y2="160"/>
        <line x1="170" y1="52" x2="240" y2="160"/>
        <line x1="780" y1="52" x2="710" y2="160"/>
        <line x1="750" y1="52" x2="680" y2="160"/>
      </g>

      <!-- Fregio Laterale Sinistro -->
      <use href="#sideFlange10" x="0" y="0"/>
      <!-- Fregio Laterale Destro (Specchiato) -->
      <use href="#sideFlange10" x="0" y="0" transform="translate(920, 0) scale(-1, 1)"/>

      <!-- Castone e Gemma Centrale Superiore (Corona) -->
      <g transform="translate(460, 38)">
        <polygon points="0,-24 24,0 0,24 -24,0" fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="1.5"/>
        <polygon points="0,-16 16,0 0,16 -16,0" fill="#083344"/>
        <polygon points="0,-13 13,0 0,13 -13,0" fill="#38bdf8"/>
        <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe"/>
      </g>

      <!-- Fregio Centrale Inferiore -->
      <polygon points="448,168 472,168 460,180" fill="url(#bronzeFrame10)" stroke="#2b1b11" stroke-width="1.5"/>

      <!-- Testo Principale "PERCORSO 1" -->
      <text x="460" y="132" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="68" letter-spacing="2" fill="url(#titleGrad10)" stroke="#0f172a" stroke-width="2" paint-order="stroke" filter="url(#textShadow10)">PERCORSO 1</text>
    </g>
  </g>
</svg>
