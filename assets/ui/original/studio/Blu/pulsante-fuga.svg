<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 225" width="100%" height="100%">
  <defs>
    <filter id="a29-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000614" flood-opacity="0.8" />
    </filter>
    <filter id="a29-elem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#00040f" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a29-gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#d4ab79" />
      <stop offset="88%" stop-color="#996832" />
      <stop offset="100%" stop-color="#543412" />
    </linearGradient>

    <linearGradient id="a29-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="35%" stop-color="#f2c06d" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <radialGradient id="a29-blue-disc" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="55%" stop-color="#062863" />
      <stop offset="88%" stop-color="#031538" />
      <stop offset="100%" stop-color="#010a1f" />
    </radialGradient>

    <linearGradient id="a29-blue-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40c4ff" />
      <stop offset="45%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0277bd" />
    </linearGradient>

    <linearGradient id="a29-ivory-runner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f7efe4" />
      <stop offset="85%" stop-color="#d6c4ae" />
      <stop offset="100%" stop-color="#9e8870" />
    </linearGradient>

    <linearGradient id="a29-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <g id="a29-gem" filter="url(#a29-elem-shadow)">
      <polygon points="0,-23 21,0 0,23 -21,0" fill="url(#a29-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-23 -21,0 -15,0 0,-17" fill="#ffffff" opacity="0.75" />
      <polygon points="0,-14 13,0 0,14 -13,0" fill="#04152e" />
      <polygon points="0,-12 11,0 0,12 -11,0" fill="url(#a29-cyan-gem)" />
      <polygon points="0,-12 11,0 0,0" fill="#6ee2ff" opacity="0.75" />
      <polygon points="0,-5 4.5,0 0,5 -4.5,0" fill="#e0faff" />
    </g>
  </defs>

  <g filter="url(#a29-shadow)" transform="translate(110, 108)">
    <!-- 1. Anello Esterno Oro Champagne -->
    <circle cx="0" cy="0" r="82" fill="url(#a29-gold-rim)" stroke="#1c130a" stroke-width="2.2" />
    <path d="M -68,-36 A 77,77 0 0,1 68,-36" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.85" stroke-linecap="round" />

    <!-- 2. Scanalatura Scura e Disco Blu Reale -->
    <circle cx="0" cy="0" r="68" fill="#020b1f" stroke="#36220e" stroke-width="1.8" />
    <circle cx="0" cy="0" r="61" fill="url(#a29-blue-disc)" stroke="url(#a29-blue-bevel)" stroke-width="3" />

    <!-- 3. Icona Omino in Corsa (Runner) Scolpita in 3D -->
    <g filter="url(#a29-elem-shadow)" fill="url(#a29-ivory-runner)" stroke="#170f06" stroke-width="2" stroke-linejoin="round">

      <!-- Gamba Posteriore Sinistra (in spinta) -->
      <path d="M -12,4 L -24,18 L -42,24 C -46,26 -47,30 -45,33 L -42,36 C -39,38 -35,38 -31,36 L -12,28 L 2,14 Z" />
      <!-- Braccio Anteriore Destro (piegato in avanti) -->
      <path d="M 12,-8 L 19,9 C 20,12 23,13 26,13 H 40 C 44,13 46,10 46,7 C 46,4 44,1 40,1 H 29 L 22,-14 Z" />
      <!-- Torso + Braccio Posteriore Sinistro + Gamba Anteriore Destra -->
      <path d="M -7,-22 L 15,-16 C 19,-15 21,-11 19,-7 L 5,10 L 21,23 C 24,26 24,30 22,33 L 11,51 C 9,54 5,54 2,52 L -3,49 C -6,47 -6,43 -4,40 L 6,25 L -16,8 C -19,5 -19,1 -16,-2 L -2,-11 L -10,-13 L -20,-4 C -23,-2 -27,-2 -29,-5 L -32,-8 C -34,-11 -34,-15 -31,-17 L -16,-23 C -13,-24 -10,-23 -7,-22 Z" />
      <!-- Testa Sferica -->
      <circle cx="23" cy="-24" r="12.5" />
    </g>

    <!-- 4. Gemme Cardinali -->
    <use href="#a29-gem" x="0" y="-78" />
    <use href="#a29-gem" x="-78" y="0" />
    <use href="#a29-gem" x="78" y="0" />
    <!-- Gemma Sud leggermente allungata -->
    <g transform="translate(0, 80)">
      <use href="#a29-gem" transform="scale(1.05, 1.18)" />
    </g>
  </g>
</svg>