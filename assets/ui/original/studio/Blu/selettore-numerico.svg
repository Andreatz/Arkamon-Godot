<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <filter id="a1-shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000614" flood-opacity="0.75" />
    </filter>
    <filter id="a1-inner-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000511" flood-opacity="0.85" />
    </filter>

    <!-- Cornice Oro Champagne / Avorio 3D -->
    <linearGradient id="a1-gold-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ead7" />
      <stop offset="55%" stop-color="#d4ad7d" />
      <stop offset="88%" stop-color="#9e6f3c" />
      <stop offset="100%" stop-color="#5e3c19" />
    </linearGradient>

    <!-- Castone Oro Caldo per Gemme -->
    <linearGradient id="a1-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e5" />
      <stop offset="35%" stop-color="#f0be6e" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#693b08" />
    </linearGradient>

    <!-- Pannello Interno Blu Reale 3D -->
    <radialGradient id="a1-blue-panel" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a3b8c" />
      <stop offset="65%" stop-color="#052159" />
      <stop offset="100%" stop-color="#021133" />
    </radialGradient>

    <!-- Bisello Luminoso Blu Elettrico -->
    <linearGradient id="a1-blue-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2979ff" />
      <stop offset="50%" stop-color="#0c439c" />
      <stop offset="100%" stop-color="#062863" />
    </linearGradient>

    <!-- Display Centrale Bianco/Perla 3D -->
    <linearGradient id="a1-white-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f2f4f8" />
      <stop offset="100%" stop-color="#d5dce6" />
    </linearGradient>
    <linearGradient id="a1-white-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ab4f8" />
      <stop offset="50%" stop-color="#d2e3fc" />
      <stop offset="100%" stop-color="#669df6" />
    </linearGradient>

    <!-- Simboli + e - in Avorio 3D -->
    <linearGradient id="a1-ivory-sym" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5ece0" />
      <stop offset="90%" stop-color="#cbbba6" />
      <stop offset="100%" stop-color="#9c8a74" />
    </linearGradient>

    <!-- Gemma Ciano Sfaccettata -->
    <linearGradient id="a1-cyan-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8f5ff" />
      <stop offset="100%" stop-color="#19b5fe" />
    </linearGradient>
    <linearGradient id="a1-cyan-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="100%" stop-color="#003d66" />
    </linearGradient>

    <!-- Componente Gemma Romboidale -->
    <g id="a1-gem" filter="url(#a1-inner-shadow)">
      <polygon points="0,-24 22,0 0,24 -22,0" fill="url(#a1-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-24 -22,0 -16,0 0,-18" fill="#ffffff" opacity="0.7" />
      <polygon points="0,-15 14,0 0,15 -14,0" fill="#04152e" stroke="#5e3a10" stroke-width="1" />
      <!-- 4 Faccette Gemma -->
      <polygon points="0,-13 12,0 0,0" fill="#4dd2ff" />
      <polygon points="0,-13 0,0 -12,0" fill="url(#a1-cyan-tl)" />
      <polygon points="0,13 12,0 0,0" fill="url(#a1-cyan-br)" />
      <polygon points="0,13 0,0 -12,0" fill="#0077b3" />
      <polygon points="0,-6 5,0 0,6 -5,0" fill="#aef2ff" opacity="0.85" />
    </g>

    <!-- Base Pulsante Laterale Ottagonale -->
    <g id="a1-side-box">
      <polygon points="34,14 122,14 152,44 152,116 122,146 34,146 4,116 4,44" fill="url(#a1-gold-frame)" stroke="#1c130a" stroke-width="2.2" stroke-linejoin="round" />
      <polyline points="6,45 35,17 121,17 149,45" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
      <polygon points="38,23 118,23 143,48 143,112 118,137 38,137 13,112 13,48" fill="#030d24" stroke="#36220e" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="42,29 114,29 136,51 136,109 114,131 42,131 20,109 20,51" fill="url(#a1-blue-panel)" stroke="url(#a1-blue-bevel)" stroke-width="2.5" stroke-linejoin="round" />
    </g>
  </defs>

  <g filter="url(#a1-shadow)">
    <!-- 1. PULSANTE SINISTRO (-) -->
    <g transform="translate(32, 0)">
      <use href="#a1-side-box" />
      <!-- Simbolo Meno (-) 3D -->
      <g filter="url(#a1-inner-shadow)">
        <rect x="46" y="69" width="64" height="22" rx="4" fill="url(#a1-ivory-sym)" stroke="#2b1e10" stroke-width="1.6" />
        <line x1="49" y1="72" x2="107" y2="72" stroke="#ffffff" stroke-width="2" />
      </g>
    </g>

    <!-- 2. DISPLAY CENTRALE BIANCO -->
    <g transform="translate(202, 0)">
      <polygon points="36,14 200,14 232,46 232,114 200,146 36,146 4,114 4,46" fill="url(#a1-gold-frame)" stroke="#1c130a" stroke-width="2.2" stroke-linejoin="round" />
      <polyline points="6,47 37,17 199,17 229,47" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
      <polygon points="40,23 196,23 223,50 223,110 196,137 40,137 13,110 13,50" fill="#030d24" stroke="#36220e" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Piastra Interna Bianca Smussata -->
      <polygon points="44,31 192,31 214,53 214,107 192,129 44,129 22,107 22,53" fill="url(#a1-white-rim)" stroke="#164799" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="47,36 189,36 209,56 209,104 189,124 47,124 27,104 27,56" fill="url(#a1-white-plate)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 3. PULSANTE DESTRO (+) -->
    <g transform="translate(452, 0)">
      <use href="#a1-side-box" />
      <!-- Simbolo Più (+) 3D -->
      <g filter="url(#a1-inner-shadow)">
        <path d="M 68,48 H 88 V 69 H 109 V 91 H 88 V 112 H 68 V 91 H 47 V 69 H 68 Z" fill="url(#a1-ivory-sym)" stroke="#2b1e10" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M 70,51 H 86 M 49,72 H 68 M 88,72 H 107" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>

    <!-- 6 GEMME ROMBOIDali CIANO DI RACCORDO -->
    <use href="#a1-gem" x="456" y="80" />
    <use href="#a1-gem" x="36" y="80" />
    <use href="#a1-gem" x="184" y="80" />
    <use href="#a1-gem" x="208" y="80" />
    <use href="#a1-gem" x="432" y="80" />
    <use href="#a1-gem" x="604" y="80" />
  </g>
</svg>