<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <filter id="a24-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000814" flood-opacity="0.8" />
    </filter>
    <filter id="a24-elem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000d14" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a24-gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#d4ab79" />
      <stop offset="88%" stop-color="#996832" />
      <stop offset="100%" stop-color="#543412" />
    </linearGradient>

    <linearGradient id="a24-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="35%" stop-color="#f2c06d" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <!-- Disco Interno Ottanio / Turchese Scuro -->
    <radialGradient id="a24-teal-disc" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#00838f" />
      <stop offset="55%" stop-color="#005662" />
      <stop offset="88%" stop-color="#00363a" />
      <stop offset="100%" stop-color="#001f24" />
    </radialGradient>

    <linearGradient id="a24-teal-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1" />
      <stop offset="50%" stop-color="#00acc1" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>

    <!-- Icona Passi Avorio 3D -->
    <linearGradient id="a24-ivory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f7f0e6" />
      <stop offset="88%" stop-color="#d6c5b1" />
      <stop offset="100%" stop-color="#9e8a72" />
    </linearGradient>

    <linearGradient id="a24-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <g id="a24-gem" filter="url(#a24-elem-shadow)">
      <polygon points="0,-23 21,0 0,23 -21,0" fill="url(#a24-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-23 -21,0 -15,0 0,-17" fill="#ffffff" opacity="0.75" />
      <polygon points="0,-14 13,0 0,14 -13,0" fill="#04152e" />
      <polygon points="0,-12 11,0 0,12 -11,0" fill="url(#a24-cyan-gem)" />
      <polygon points="0,-12 11,0 0,0" fill="#6ee2ff" opacity="0.75" />
      <polygon points="0,-5 4.5,0 0,5 -4.5,0" fill="#e0faff" />
    </g>
  </defs>

  <g filter="url(#a24-shadow)" transform="translate(110, 110)">
    <!-- 1. Anello Esterno Oro Champagne -->
    <circle cx="0" cy="0" r="82" fill="url(#a24-gold-rim)" stroke="#1c130a" stroke-width="2.2" />
    <path d="M -68,-36 A 77,77 0 0,1 68,-36" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.85" stroke-linecap="round" />

    <!-- 2. Scanalatura Scura -->
    <circle cx="0" cy="0" r="68" fill="#021014" stroke="#36220e" stroke-width="1.8" />

    <!-- 3. Disco Centrale Turchese Profondo -->
    <circle cx="0" cy="0" r="62" fill="url(#a24-teal-disc)" stroke="url(#a24-teal-bevel)" stroke-width="3" />
    <path d="M -46,-28 A 55,55 0 0,1 46,-28" fill="none" stroke="#84ffff" stroke-width="2.2" opacity="0.7" stroke-linecap="round" />

    <!-- 4. Icona Impronte / Passi 3D -->
    <g filter="url(#a24-elem-shadow)" fill="url(#a24-ivory)" stroke="#081c24" stroke-width="2.2" stroke-linejoin="round">
      <!-- Impronta Sinistra (Più bassa) -->
      <g transform="translate(-20, 14) rotate(-8)">
        <path d="M -14,-18 C -14,-35 14,-35 14,-18 C 14,-5 10,8 9,14 L -9,14 C -10,8 -14,-5 -14,-18 Z" />
        <path d="M -9,19 L 9,19 L 8,30 C 7,37 -7,37 -8,30 Z" />
      </g>
      <!-- Impronta Destra (Più alta) -->
      <g transform="translate(18, -12) rotate(12)">
        <path d="M -14,-18 C -14,-35 14,-35 14,-18 C 14,-5 10,8 9,14 L -9,14 C -10,8 -14,-5 -14,-18 Z" />
        <path d="M -9,19 L 9,19 L 8,30 C 7,37 -7,37 -8,30 Z" />
      </g>
    </g>

    <!-- 5. Gemme Cardinali -->
    <use href="#a24-gem" x="0" y="-78" />
    <use href="#a24-gem" x="0" y="78" />
    <use href="#a24-gem" x="-78" y="0" />
    <use href="#a24-gem" x="78" y="0" />
  </g>
</svg>