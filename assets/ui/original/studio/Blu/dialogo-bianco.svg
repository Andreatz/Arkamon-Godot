<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%">
  <defs>
    <filter id="dropShadow34" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Cornice Metallica Avorio-Oro Champagne -->
    <linearGradient id="champagneGold34" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f7eed7"/>
      <stop offset="55%" stop-color="#bfa074"/>
      <stop offset="82%" stop-color="#e5d1b3"/>
      <stop offset="100%" stop-color="#6e522c"/>
    </linearGradient>

    <linearGradient id="goldBezel34" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="40%" stop-color="#f2c46d"/>
      <stop offset="80%" stop-color="#9c6b24"/>
      <stop offset="100%" stop-color="#472c06"/>
    </linearGradient>

    <!-- Smusso Ghiaccio/Azzurro Chiaro per la Lastra Perla -->
    <linearGradient id="iceBevel34" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#dbeafe"/>
      <stop offset="80%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Nucleo Marmo Bianco Perla Caldo -->
    <radialGradient id="pearlCore34" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#e6e1d8"/>
    </radialGradient>

    <clipPath id="bubbleClip34">
      <polygon points="126,58 734,58 768,92 768,292 734,326 244,326 174,368 184,326 126,326 92,292 92,92"/>
    </clipPath>

    <!-- Gemma Laterale Romboidale -->
    <g id="sideGem34">
      <polygon points="0,-46 44,0 0,46 -44,0" fill="url(#goldBezel34)" stroke="#171005" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-38 36,0 0,38 -36,0" fill="none" stroke="#fffbeb" stroke-width="1.2" opacity="0.8"/>
      <polygon points="0,-31 29,0 0,31 -29,0" fill="#291907" stroke="#593a12" stroke-width="1"/>
      <polygon points="0,-24 22,0 0,24 -22,0" fill="#06b6d4" stroke="#083344" stroke-width="1.5"/>
      <polygon points="0,-24 22,0 0,0" fill="#a5f3fc"/>
      <polygon points="0,-24 0,0 -22,0" fill="#22d3ee"/>
      <polygon points="0,0 22,0 0,24" fill="#0284c7"/>
      <polygon points="0,-11 10,0 0,11 -10,0" fill="#ecfeff"/>
    </g>
  </defs>

  <g filter="url(#dropShadow34)">
    <!-- 1. CORNICE ESTERNA IN ORO CHAMPAGNE -->
    <polygon points="104,22 756,22 812,78 812,310 756,366 258,366 118,442 134,366 104,366 48,310 48,78" 
             fill="url(#champagneGold34)" stroke="#171108" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="106,27 754,27 807,80" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>

    <!-- Trincea Blu Notte Scura a Contrasto -->
    <polygon points="111,36 749,36 796,83 796,303 749,350 252,350 140,414 154,350 111,350 64,303 64,83" 
             fill="#031430" stroke="#010817" stroke-width="2" stroke-linejoin="round"/>
    <!-- Filetto Blu Elettrico nella Trincea -->
    <polygon points="114,40 746,40 791,85 791,301 746,346 250,346 146,406 159,346 114,346 69,301 69,85" 
             fill="none" stroke="#0284c7" stroke-width="1.8" opacity="0.75"/>

    <!-- 2. LASTRA INTERNA BIANCO PERLA / GHIACCIO 3D -->
    <!-- Smusso Esterno Ghiaccio -->
    <polygon points="118,46 742,46 784,88 784,298 742,340 248,340 158,392 170,340 118,340 76,298 76,88" 
             fill="url(#iceBevel34)" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Piano Superiore Bianco Perla -->
    <polygon points="126,58 734,58 768,92 768,292 734,326 244,326 174,368 184,326 126,326 92,292 92,92" 
             fill="url(#pearlCore34)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Venature Eteree Perlacee Interne -->
    <g clip-path="url(#bubbleClip34)">
      <path d="M 225,58 C 165,145 200,260 350,326" fill="none" stroke="#d6d1c7" stroke-width="12" opacity="0.45" filter="blur(4px)"/>
      <path d="M 240,58 C 180,150 215,260 370,326" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
      <path d="M 92,215 C 175,220 245,275 310,326" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <path d="M 655,58 C 715,145 685,260 540,326" fill="none" stroke="#d6d1c7" stroke-width="10" opacity="0.4" filter="blur(4px)"/>
    </g>

    <!-- 3. GEMME LATERALI SINISTRA E DESTRA -->
    <use href="#sideGem34" x="58" y="194"/>
    <use href="#sideGem34" x="802" y="194"/>
  </g>
</svg>
