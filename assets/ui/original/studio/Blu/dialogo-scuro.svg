<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%">
  <defs>
    <filter id="dropShadow33" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Cornice Metallica Avorio-Oro Champagne -->
    <linearGradient id="champagneGold33" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f7eed7"/>
      <stop offset="55%" stop-color="#bfa074"/>
      <stop offset="82%" stop-color="#e5d1b3"/>
      <stop offset="100%" stop-color="#6e522c"/>
    </linearGradient>

    <linearGradient id="goldBezel33" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="40%" stop-color="#f2c46d"/>
      <stop offset="80%" stop-color="#9c6b24"/>
      <stop offset="100%" stop-color="#472c06"/>
    </linearGradient>

    <!-- Smusso Blu Elettrico Interno -->
    <linearGradient id="sapphireBevel33" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="15%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#034078"/>
      <stop offset="85%" stop-color="#001d3d"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Nucleo Vetro Blu Zaffiro Profondo -->
    <radialGradient id="sapphireGlass33" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#053b82"/>
      <stop offset="55%" stop-color="#022254"/>
      <stop offset="100%" stop-color="#01112e"/>
    </radialGradient>

    <clipPath id="bubbleClip33">
      <polygon points="118,52 742,52 778,88 778,296 742,332 246,332 162,382 174,332 118,332 82,296 82,88"/>
    </clipPath>

    <!-- Gemma Laterale Romboidale -->
    <g id="sideGem33">
      <polygon points="0,-46 44,0 0,46 -44,0" fill="url(#goldBezel33)" stroke="#171005" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-38 36,0 0,38 -36,0" fill="none" stroke="#fffbeb" stroke-width="1.2" opacity="0.8"/>
      <polygon points="0,-31 29,0 0,31 -29,0" fill="#291907" stroke="#593a12" stroke-width="1"/>
      <polygon points="0,-24 22,0 0,24 -22,0" fill="#06b6d4" stroke="#083344" stroke-width="1.5"/>
      <polygon points="0,-24 22,0 0,0" fill="#a5f3fc"/>
      <polygon points="0,-24 0,0 -22,0" fill="#22d3ee"/>
      <polygon points="0,0 22,0 0,24" fill="#0284c7"/>
      <polygon points="0,-11 10,0 0,11 -10,0" fill="#ecfeff"/>
    </g>
  </defs>

  <g filter="url(#dropShadow33)">
    <!-- 1. CORNICE ESTERNA IN ORO CHAMPAGNE CON CODA FUMETTO -->
    <polygon points="104,22 756,22 812,78 812,310 756,366 258,366 118,442 134,366 104,366 48,310 48,78" 
             fill="url(#champagneGold33)" stroke="#171108" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Filetto di luce superiore 3D -->
    <polyline points="106,27 754,27 807,80" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>

    <!-- Trincea Blu Notte Scura -->
    <polygon points="111,36 749,36 796,83 796,303 749,350 252,350 140,414 154,350 111,350 64,303 64,83" 
             fill="#020917" stroke="#5c4524" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- 2. CORPO IN VETRO BLU ZAFFIRO SMUSSATO -->
    <polygon points="118,46 742,46 784,88 784,298 742,340 248,340 158,392 170,340 118,340 76,298 76,88" 
             fill="url(#sapphireBevel33)" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Piano Interno Blu Zaffiro Profondo -->
    <polygon points="126,58 734,58 768,92 768,292 734,326 244,326 174,368 184,326 126,326 92,292 92,92" 
             fill="url(#sapphireGlass33)"/>

    <!-- Venature Eteree Luminose nel Vetro Blu -->
    <g clip-path="url(#bubbleClip33)">
      <path d="M 190,52 C 140,140 175,260 320,332 L 82,332 L 82,52 Z" fill="#0284c7" opacity="0.24"/>
      <path d="M 210,52 C 155,145 195,260 350,332" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4"/>
      <path d="M 82,215 C 165,220 235,280 295,332" fill="none" stroke="#7dd3fc" stroke-width="1.8" opacity="0.35"/>

      <path d="M 685,52 C 745,140 715,260 565,332 L 778,332 L 778,52 Z" fill="#0284c7" opacity="0.22"/>
      <path d="M 665,52 C 725,145 695,260 535,332" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.38"/>
      <path d="M 778,195 C 700,205 630,275 570,332" fill="none" stroke="#7dd3fc" stroke-width="1.8" opacity="0.3"/>
    </g>

    <!-- Filetto Speculare Orizzontale Superiore e Inferiore -->
    <polyline points="96,90 126,60 734,60 764,90" fill="none" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <polyline points="244,324 734,324 764,294" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- 3. GEMME LATERALI SINISTRA E DESTRA -->
    <use href="#sideGem33" x="58" y="194"/>
    <use href="#sideGem33" x="802" y="194"/>
  </g>
</svg>
