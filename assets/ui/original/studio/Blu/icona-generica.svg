<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" width="100%" height="100%">
  <defs>
    <filter id="a23-shadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000614" flood-opacity="0.8" />
    </filter>
    <filter id="a23-gem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#00040d" flood-opacity="0.85" />
    </filter>

    <linearGradient id="a23-gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#d4ab79" />
      <stop offset="88%" stop-color="#996832" />
      <stop offset="100%" stop-color="#543412" />
    </linearGradient>

    <linearGradient id="a23-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="35%" stop-color="#f2c06d" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <!-- Sfera Centrale Bianco Perla / Avorio 3D -->
    <radialGradient id="a23-pearl-orb" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="48%" stop-color="#fcf8f2" />
      <stop offset="82%" stop-color="#e0d1be" />
      <stop offset="100%" stop-color="#a68e74" />
    </radialGradient>

    <linearGradient id="a23-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <g id="a23-gem" filter="url(#a23-gem-shadow)">
      <polygon points="0,-22 20,0 0,22 -20,0" fill="url(#a23-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-22 -20,0 -14,0 0,-16" fill="#ffffff" opacity="0.75" />
      <polygon points="0,-13 12,0 0,13 -12,0" fill="#04152e" />
      <polygon points="0,-11 10,0 0,11 -10,0" fill="url(#a23-cyan-gem)" />
      <polygon points="0,-11 10,0 0,0" fill="#6ee2ff" opacity="0.75" />
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#e0faff" />
    </g>
  </defs>

  <g filter="url(#a23-shadow)" transform="translate(105, 105)">
    <!-- 1. Anello Esterno Oro Champagne -->
    <circle cx="0" cy="0" r="68" fill="url(#a23-gold-rim)" stroke="#1c130a" stroke-width="2.2" />
    <path d="M -56,-30 A 64,64 0 0,1 56,-30" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.85" stroke-linecap="round" />

    <!-- 2. Scanalatura Scura -->
    <circle cx="0" cy="0" r="55" fill="#0d0905" stroke="#3b230b" stroke-width="1.8" />

    <!-- 3. Globo Bianco Perla Bombato 3D -->
    <circle cx="0" cy="0" r="49" fill="url(#a23-pearl-orb)" stroke="#d6c5b3" stroke-width="1.2" />
    <path d="M -34,30 A 45,45 0 0,0 34,30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round" />
    <ellipse cx="-13" cy="-16" rx="16" ry="11" transform="rotate(-25 -13 -16)" fill="#ffffff" opacity="0.95" />

    <!-- 4. Gemme Cardinali -->
    <use href="#a23-gem" x="0" y="-66" />
    <use href="#a23-gem" x="0" y="66" />
    <use href="#a23-gem" x="-66" y="0" />
    <use href="#a23-gem" x="66" y="0" />
  </g>
</svg>