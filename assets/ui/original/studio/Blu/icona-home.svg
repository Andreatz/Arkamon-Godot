<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 235" width="100%" height="100%">
  <defs>
    <filter id="a26-shadow" x="-12%" y="-10%" width="124%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000614" flood-opacity="0.8" />
    </filter>
    <filter id="a26-elem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#00040f" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a26-gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#d4ab79" />
      <stop offset="88%" stop-color="#996832" />
      <stop offset="100%" stop-color="#543412" />
    </linearGradient>

    <linearGradient id="a26-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="35%" stop-color="#f2c06d" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <radialGradient id="a26-blue-disc" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="55%" stop-color="#062863" />
      <stop offset="88%" stop-color="#031538" />
      <stop offset="100%" stop-color="#010a1f" />
    </radialGradient>

    <linearGradient id="a26-blue-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40c4ff" />
      <stop offset="45%" stop-color="#1565c0" />
      <stop offset="100%" stop-color="#0277bd" />
    </linearGradient>

    <linearGradient id="a26-ivory-house" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f5ece0" />
      <stop offset="90%" stop-color="#d4c2ac" />
      <stop offset="100%" stop-color="#a38d74" />
    </linearGradient>

    <linearGradient id="a26-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <g id="a26-gem" filter="url(#a26-elem-shadow)">
      <polygon points="0,-23 21,0 0,23 -21,0" fill="url(#a26-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-23 -21,0 -15,0 0,-17" fill="#ffffff" opacity="0.75" />
      <polygon points="0,-14 13,0 0,14 -13,0" fill="#04152e" />
      <polygon points="0,-12 11,0 0,12 -11,0" fill="url(#a26-cyan-gem)" />
      <polygon points="0,-12 11,0 0,0" fill="#6ee2ff" opacity="0.75" />
      <polygon points="0,-5 4.5,0 0,5 -4.5,0" fill="#e0faff" />
    </g>
  </defs>

  <g filter="url(#a26-shadow)" transform="translate(110, 106)">
    <!-- 1. Anello Esterno Oro Champagne -->
    <circle cx="0" cy="0" r="82" fill="url(#a26-gold-rim)" stroke="#1c130a" stroke-width="2.2" />
    <path d="M -68,-36 A 77,77 0 0,1 68,-36" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.85" stroke-linecap="round" />

    <!-- 2. Scanalatura Scura e Disco Blu Reale -->
    <circle cx="0" cy="0" r="68" fill="#020b1f" stroke="#36220e" stroke-width="1.8" />
    <circle cx="0" cy="0" r="61" fill="url(#a26-blue-disc)" stroke="url(#a26-blue-bevel)" stroke-width="3" />
    <path d="M -46,-28 A 54,54 0 0,1 46,-28" fill="none" stroke="#80d8ff" stroke-width="2.2" opacity="0.8" stroke-linecap="round" />

    <!-- 3. Icona Casa / Home 3D con Porta ad Arco (fill-rule="evenodd") -->
    <g filter="url(#a26-elem-shadow)">
      <path d="M 0,-42 L 44,-2 C 46,0 45,3 42,3 H 32 V 35 C 32,37 30,39 28,39 H -28 C -30,39 -32,37 -32,35 V 3 H -42 C -45,3 -46,0 -44,-2 Z
               M -12,31 H 12 V 8 A 12,12 0 0,0 -12,8 Z" fill="url(#a26-ivory-house)" fill-rule="evenodd" stroke="#170f06" stroke-width="2" stroke-linejoin="round" />
      <!-- Luce speculare lungo gli spioventi del tetto -->
      <polyline points="-41,0 0,-38 41,0" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.9" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 4. Gemme Cardinali (Nord, Ovest, Est + Sud con Puntale Allungato) -->
    <use href="#a26-gem" x="0" y="-78" />
    <use href="#a26-gem" x="-78" y="0" />
    <use href="#a26-gem" x="78" y="0" />

    <g transform="translate(0, 78)" filter="url(#a26-elem-shadow)">
      <polygon points="0,-24 23,-2 0,40 -23,-2" fill="url(#a26-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-24 -23,-2 -16,-2 0,36" fill="#fff3db" opacity="0.65" />
      <polygon points="0,40 23,-2 16,-2 0,20" fill="#693b08" opacity="0.8" />
      <polygon points="0,-15 14,-1 0,13 -14,-1" fill="#04152e" />
      <polygon points="0,-13 12,-1 0,11 -12,-1" fill="url(#a26-cyan-gem)" />
      <polygon points="0,-13 12,-1 0,-1" fill="#6ee2ff" opacity="0.75" />
      <polygon points="0,-5 4.5,-1 0,4 -4.5,-1" fill="#e0faff" />
    </g>
  </g>
</svg>