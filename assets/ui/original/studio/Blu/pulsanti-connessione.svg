<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 195" width="100%" height="100%">
  <defs>
    <filter id="a35-shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000614" flood-opacity="0.8" />
    </filter>
    <filter id="a35-sym-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2" flood-color="#00040d" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a35-gold-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#d4ab79" />
      <stop offset="88%" stop-color="#996832" />
      <stop offset="100%" stop-color="#543412" />
    </linearGradient>

    <linearGradient id="a35-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="35%" stop-color="#f2c06d" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <radialGradient id="a35-navy-panel" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0a3880" />
      <stop offset="65%" stop-color="#041b47" />
      <stop offset="100%" stop-color="#010a1f" />
    </radialGradient>

    <!-- Metallo Argento/Perla per le Catene -->
    <linearGradient id="a35-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e8ecef" />
      <stop offset="80%" stop-color="#adb5bd" />
      <stop offset="100%" stop-color="#6c757d" />
    </linearGradient>

    <!-- Oro Caldo per Lucchetto, Clessidra e Catena Spezzata -->
    <linearGradient id="a35-warm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9db" />
      <stop offset="35%" stop-color="#ffd43b" />
      <stop offset="75%" stop-color="#f08c00" />
      <stop offset="100%" stop-color="#8c4600" />
    </linearGradient>

    <!-- Rosso Corallo per Scintille e Croce X -->
    <linearGradient id="a35-coral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc9c9" />
      <stop offset="35%" stop-color="#ff6b6b" />
      <stop offset="80%" stop-color="#e03131" />
      <stop offset="100%" stop-color="#861818" />
    </linearGradient>

    <!-- Ciano Brillante per Freccia Refresh -->
    <linearGradient id="a35-cyan-arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8ffff" />
      <stop offset="40%" stop-color="#00e5ff" />
      <stop offset="85%" stop-color="#0091ea" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <!-- Gemma Cardinale Piccola -->
    <g id="a35-gem" filter="url(#a35-sym-shadow)">
      <polygon points="0,-18 16,0 0,18 -16,0" fill="url(#a35-gem-gold)" stroke="#241406" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="0,-11 10,0 0,11 -10,0" fill="#04152e" />
      <polygon points="0,-9.5 8.5,0 0,9.5 -8.5,0" fill="url(#a35-cyan-arrow)" />
      <polygon points="0,-4 3.5,0 0,4 -3.5,0" fill="#e0faff" />
    </g>

    <!-- Base Pulsante Ottagonale con 4 Gemme Cardinali -->
    <g id="a35-oct-btn">
      <polygon points="-44,-68 44,-68 68,-44 68,44 44,68 -44,68 -68,44 -68,-44" fill="url(#a35-gold-frame)" stroke="#1c130a" stroke-width="2" stroke-linejoin="round" />
      <polyline points="-65,-43 -43,-65 43,-65 65,-43" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.85" />
      <polygon points="-40,-59 40,-59 59,-40 59,40 40,59 -40,59 -59,40 -59,-40" fill="url(#a35-navy-panel)" stroke="#0d47a1" stroke-width="2" stroke-linejoin="round" />
      <use href="#a35-gem" x="0" y="-66" />
      <use href="#a35-gem" x="0" y="66" />
      <use href="#a35-gem" x="-66" y="0" />
      <use href="#a35-gem" x="66" y="0" />
    </g>

    <!-- Icona Catena Argento Intatta Riutilizzabile -->
    <g id="a35-chain-silver" filter="url(#a35-sym-shadow)">
      <g transform="rotate(-45)">
        <!-- Anello Sinistro -->
        <rect x="-42" y="-14" width="48" height="28" rx="14" fill="none" stroke="#14181f" stroke-width="13" />
        <rect x="-42" y="-14" width="48" height="28" rx="14" fill="none" stroke="url(#a35-silver)" stroke-width="9" />
        <!-- Anello Destro -->
        <rect x="-6" y="-14" width="48" height="28" rx="14" fill="none" stroke="#14181f" stroke-width="13" />
        <rect x="-6" y="-14" width="48" height="28" rx="14" fill="none" stroke="url(#a35-silver)" stroke-width="9" />
        <!-- Sovrapposizione Intreccio Centrale -->
        <path d="M -10,-14 H -8 A 14,14 0 0,1 6,0" fill="none" stroke="#14181f" stroke-width="13" />
        <path d="M -12,-14 H -8 A 14,14 0 0,1 6,0" fill="none" stroke="url(#a35-silver)" stroke-width="9" />
      </g>
    </g>
  </defs>

  <g filter="url(#a35-shadow)">
    <!-- 1. LINK + SPUNTA VERDE SMERALDO -->
    <g transform="translate(90, 97.5)">
      <use href="#a35-oct-btn" />
      <use href="#a35-chain-silver" transform="translate(-4, -4)" />
      <g transform="translate(23, 25)" filter="url(#a35-sym-shadow)">
        <circle cx="0" cy="0" r="19" fill="#00bfa5" stroke="#003d33" stroke-width="2" />
        <circle cx="0" cy="0" r="16" fill="#1de9b6" />
        <polyline points="-8,0 -2,6 9,-6" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 2. LINK + 3 PUNTINI PERLATI (...) -->
    <g transform="translate(260, 97.5)">
      <use href="#a35-oct-btn" />
      <use href="#a35-chain-silver" transform="translate(0, -10) scale(0.9)" />
      <g filter="url(#a35-sym-shadow)" fill="url(#a35-silver)" stroke="#14181f" stroke-width="1.5">
        <circle cx="-24" cy="32" r="7.5" />
        <circle cx="0" cy="32" r="7.5" />
        <circle cx="24" cy="32" r="7.5" />
      </g>
    </g>

    <!-- 3. LINK SPEZZATO D'ORO CON SCINTILLE CORALLO -->
    <g transform="translate(430, 97.5)">
      <use href="#a35-oct-btn" />
      <g filter="url(#a35-sym-shadow)">
        <!-- Metà inferiore sinistra della catena -->
        <g transform="translate(-16, 16) rotate(-45)">
          <path d="M 4,-14 H -20 A 14,14 0 0,0 -20,14 H 4" fill="none" stroke="#241304" stroke-width="13" stroke-linecap="round" />
          <path d="M 4,-14 H -20 A 14,14 0 0,0 -20,14 H 4" fill="none" stroke="url(#a35-warm-gold)" stroke-width="9" stroke-linecap="round" />
        </g>
        <!-- Metà superiore destra della catena -->
        <g transform="translate(16, -12) rotate(-45)">
          <path d="M -4,-14 H 20 A 14,14 0 0,1 20,14 H -4" fill="none" stroke="#241304" stroke-width="13" stroke-linecap="round" />
          <path d="M -4,-14 H 20 A 14,14 0 0,1 20,14 H -4" fill="none" stroke="url(#a35-warm-gold)" stroke-width="9" stroke-linecap="round" />
        </g>
        <!-- Scintille / Frammenti Corallo -->
        <g fill="url(#a35-coral)" stroke="#2b0909" stroke-width="1.4" stroke-linejoin="round">
          <polygon points="-14,-16 -26,-32 -18,-36 -10,-20" />
          <polygon points="-4,-20 -6,-40 4,-38 2,-20" />
          <polygon points="-20,-8 -36,-12 -33,-20 -18,-13" />
          <polygon points="6,4 16,18 10,23 0,9" />
        </g>
      </g>
    </g>

    <!-- 4. LUCCHETTO D'ORO 3D -->
    <g transform="translate(600, 97.5)">
      <use href="#a35-oct-btn" />
      <g filter="url(#a35-sym-shadow)">
        <path d="M -20,-8 V -22 A 20,20 0 0,1 20,-22 V -8 H 10 V -22 A 10,10 0 0,0 -10,-22 V -8 Z" fill="url(#a35-warm-gold)" stroke="#241304" stroke-width="2" stroke-linejoin="round" />
        <rect x="-30" y="-10" width="60" height="46" rx="8" fill="url(#a35-warm-gold)" stroke="#241304" stroke-width="2" />
        <path d="M -25,30 V -4 H 25" fill="none" stroke="#fff9db" stroke-width="1.8" opacity="0.85" stroke-linecap="round" />
        <path d="M 0,4 A 6.5,6.5 0 1,0 -4,15.5 L -5,24 H 5 L 4,15.5 A 6.5,6.5 0 0,0 0,4 Z" fill="#1f1105" />
      </g>
    </g>

    <!-- 5. CLESSIDRA D'ORO CON SABBIA AMBRA -->
    <g transform="translate(770, 97.5)">
      <use href="#a35-oct-btn" />
      <g filter="url(#a35-sym-shadow)">
        <!-- Ampolle di vetro -->
        <path d="M -22,-30 C -22,-10 -6,-4 -4,0 C -6,4 -22,10 -22,30 H 22 C 22,10 6,4 4,0 C 6,-4 22,-10 22,-30 Z" fill="#cce5ff" fill-opacity="0.25" stroke="url(#a35-silver)" stroke-width="3" />
        <!-- Sabbia Ambra Superiore e Inferiore -->
        <path d="M -15,-18 Q 0,-14 15,-18 C 12,-9 4,-4 0,-1 C -4,-4 -12,-9 -15,-18 Z" fill="url(#a35-warm-gold)" />
        <path d="M -18,28 C -16,16 -4,8 0,3 C 4,8 16,16 18,28 Z" fill="url(#a35-warm-gold)" />
        <line x1="0" y1="-2" x2="0" y2="12" stroke="#ffd43b" stroke-width="2.5" />
        <!-- Montatura e Basi d'Oro -->
        <rect x="-28" y="-36" width="56" height="8" rx="4" fill="url(#a35-warm-gold)" stroke="#241304" stroke-width="1.8" />
        <rect x="-28" y="28" width="56" height="8" rx="4" fill="url(#a35-warm-gold)" stroke="#241304" stroke-width="1.8" />
      </g>
    </g>

    <!-- 6. LINK CATENA ARGENTO SEMPLICE -->
    <g transform="translate(940, 97.5)">
      <use href="#a35-oct-btn" />
      <use href="#a35-chain-silver" transform="scale(0.92)" />
    </g>

    <!-- 7. FRECCIA RICARICA / REFRESH CIANO -->
    <g transform="translate(1110, 97.5)">
      <use href="#a35-oct-btn" />
      <g filter="url(#a35-sym-shadow)">
        <path d="M 24,6 A 25,25 0 1,1 14,-19 L 7,-11 H 29 V -33 L 21,-25 A 35,35 0 1,0 34,6 Z" fill="url(#a35-cyan-arrow)" stroke="#011c2b" stroke-width="2" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 8. CROCE ROSSA / CORALLO (X) -->
    <g transform="translate(1280, 97.5)">
      <use href="#a35-oct-btn" />
      <g filter="url(#a35-sym-shadow)">
        <path d="M -18,-26 L 0,-8 L 18,-26 L 26,-18 L 8,0 L 26,18 L 18,26 L 0,8 L -18,26 L -26,18 L -8,0 L -26,-18 Z" fill="url(#a35-coral)" stroke="#2b0909" stroke-width="2" stroke-linejoin="round" />
        <polyline points="-23,-18 -18,-23 0,-5 18,-23 23,-18" fill="none" stroke="#ffe3e3" stroke-width="1.8" opacity="0.85" />
      </g>
    </g>
  </g>
</svg>