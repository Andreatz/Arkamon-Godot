<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 330" width="100%" height="100%">
  <defs>
    <filter id="dropShadow26" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Metallo Avorio-Argento-Oro -->
    <linearGradient id="metalFrame26" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f5efe0"/>
      <stop offset="55%" stop-color="#c4b090"/>
      <stop offset="85%" stop-color="#dfd0b8"/>
      <stop offset="100%" stop-color="#856d4d"/>
    </linearGradient>

    <linearGradient id="goldRim26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Colonna Sinistra Blu Notte Scuro -->
    <linearGradient id="sidebarNavy26" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="50%" stop-color="#152942"/>
      <stop offset="100%" stop-color="#091321"/>
    </linearGradient>

    <!-- Vetro Blu Zaffiro Principale -->
    <radialGradient id="sapphireGlass26" cx="55%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#063780"/>
      <stop offset="55%" stop-color="#032254"/>
      <stop offset="100%" stop-color="#011230"/>
    </radialGradient>

    <!-- Header Bianco Perla -->
    <linearGradient id="headerPearl26" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Rivetto Oro 3D -->
    <radialGradient id="goldStud26" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <clipPath id="sapphireClip26">
      <polygon points="145,86 988,86 1018,116 1018,268 994,292 145,292 122,269 122,109"/>
    </clipPath>

    <!-- Gemma Romboidale -->
    <g id="diamondGem26">
      <polygon points="0,-36 32,0 0,36 -32,0" fill="url(#metalFrame26)" stroke="#1f170d" stroke-width="2" stroke-linejoin="round"/>
      <polygon points="0,-29 25,0 0,29 -25,0" fill="url(#goldRim26)"/>
      <polygon points="0,-21 17,0 0,21 -17,0" fill="#0891b2" stroke="#042f2e" stroke-width="1"/>
      <polygon points="0,-21 17,0 0,0" fill="#67e8f9"/>
      <polygon points="0,-21 0,0 -17,0" fill="#22d3ee"/>
      <polygon points="0,0 17,0 0,21" fill="#0e7490"/>
      <polygon points="0,-10 8,0 0,10 -8,0" fill="#ecfeff"/>
    </g>
  </defs>

  <g filter="url(#dropShadow26)">
    <!-- 1. STRUTTURA ESTERNA CONTINUA IN METALLO -->
    <polygon points="48,14 996,14 1042,60 1042,278 1006,314 48,314 22,288 22,40" 
             fill="url(#metalFrame26)" stroke="#1a140c" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Trincea Scura Generale -->
    <polygon points="54,24 990,24 1030,64 1030,272 998,304 54,304 34,284 34,44" 
             fill="#020c1f" stroke="#6e5a3f" stroke-width="1.5"/>

    <!-- 2. AREA PRINCIPALE IN VETRO BLU ZAFFIRO (BASSO-DESTRA) -->
    <polygon points="145,86 988,86 1018,116 1018,268 994,292 145,292 122,269 122,109" 
             fill="url(#sapphireGlass26)" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>

    <!-- Venature Eteree Luminose nel Vetro Blu -->
    <g clip-path="url(#sapphireClip26)">
      <path d="M 225,86 C 175,145 200,240 330,292 L 120,292 L 120,86 Z" fill="#0284c7" opacity="0.22"/>
      <path d="M 240,86 C 185,150 215,240 355,292" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
      <path d="M 122,210 C 185,215 245,255 300,292" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.3"/>

      <path d="M 905,86 C 955,145 925,240 780,292 L 1018,292 L 1018,86 Z" fill="#0284c7" opacity="0.22"/>
      <path d="M 890,86 C 940,150 910,240 755,292" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
      <path d="M 1018,185 C 940,195 875,250 815,292" fill="none" stroke="#7dd3fc" stroke-width="1.8" opacity="0.3"/>

      <!-- Cornice interna sfaccettata -->
      <polygon points="152,94 982,94 1008,120 1008,262 988,282 152,282 132,262 132,120" 
               fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.45"/>
    </g>

    <!-- Rivetto d'oro in basso a destra e piccola gemma sul bordo destro -->
    <circle cx="1004" cy="276" r="7" fill="url(#goldStud26)" stroke="#1f1204" stroke-width="1.5"/>
    <g transform="translate(1024, 96)">
      <polygon points="0,-14 14,0 0,14 -14,0" fill="url(#metalFrame26)" stroke="#1a140c" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#06b6d4" stroke="#083344" stroke-width="1"/>
      <circle cx="-2" cy="-2" r="2" fill="#ffffff"/>
    </g>

    <!-- 3. BARRA HEADER SUPERIORE BIANCO PERLA -->
    <g>
      <!-- Cornice Metallica Header -->
      <polygon points="156,22 990,22 1014,46 1014,56 992,78 156,78 138,60 138,40" 
               fill="url(#metalFrame26)" stroke="#1a140c" stroke-width="2" stroke-linejoin="round"/>
      <!-- Lastra Bianco Perla -->
      <polygon points="162,29 984,29 1004,49 986,69 162,69 146,53 146,45" 
               fill="url(#headerPearl26)" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Rivetti d'oro alle estremità dell'Header -->
      <circle cx="172" cy="49" r="8.5" fill="url(#goldStud26)" stroke="#1f1204" stroke-width="1.5"/>
      <circle cx="976" cy="49" r="8.5" fill="url(#goldStud26)" stroke="#1f1204" stroke-width="1.5"/>
      <!-- Gemma Centrale dell'Header -->
      <use href="#diamondGem26" x="572" y="49"/>
    </g>

    <!-- 4. COLONNA VERTICALE SINISTRA (SIDEBAR) -->
    <g>
      <!-- Cornice Metallica Colonna -->
      <polygon points="48,18 92,18 114,40 114,288 92,310 48,310 26,288 26,40" 
               fill="url(#metalFrame26)" stroke="#1a140c" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Interno Blu Notte Colonna -->
      <polygon points="54,28 86,28 102,44 102,284 86,300 54,300 38,284 38,44" 
               fill="url(#sidebarNavy26)" stroke="#eab308" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Rivetti d'oro Superiore e Inferiore della Colonna -->
      <circle cx="70" cy="48" r="8.5" fill="url(#goldStud26)" stroke="#1f1204" stroke-width="1.5"/>
      <circle cx="70" cy="280" r="8.5" fill="url(#goldStud26)" stroke="#1f1204" stroke-width="1.5"/>
      <!-- Gemma Romboidale al Centro della Colonna -->
      <use href="#diamondGem26" x="70" y="168"/>
    </g>
  </g>
</svg>
