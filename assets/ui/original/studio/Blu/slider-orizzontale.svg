<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="100%" height="100%">
  <defs>
    <filter id="a10-shadow" x="-5%" y="-12%" width="110%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000614" flood-opacity="0.8" />
    </filter>
    <filter id="a10-center-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#00030a" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a10-gold-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#cfb08b" />
      <stop offset="88%" stop-color="#946e42" />
      <stop offset="100%" stop-color="#543818" />
    </linearGradient>

    <linearGradient id="a10-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="30%" stop-color="#f5c97d" />
      <stop offset="70%" stop-color="#bd7c2a" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <linearGradient id="a10-blue-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031740" />
      <stop offset="50%" stop-color="#072b70" />
      <stop offset="100%" stop-color="#021130" />
    </linearGradient>

    <linearGradient id="a10-empty-track" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020f2b" />
      <stop offset="55%" stop-color="#052154" />
      <stop offset="100%" stop-color="#083178" />
    </linearGradient>

    <!-- Riempimento Barra Turchese / Ciano Brillante -->
    <linearGradient id="a10-cyan-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8ffff" />
      <stop offset="22%" stop-color="#19f5e8" />
      <stop offset="75%" stop-color="#00deb6" />
      <stop offset="100%" stop-color="#008f7a" />
    </linearGradient>

    <!-- Faccette Grande Gemma Centrale -->
    <linearGradient id="a10-gem-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0faff" />
      <stop offset="60%" stop-color="#4dd2ff" />
      <stop offset="100%" stop-color="#0099e6" />
    </linearGradient>
    <linearGradient id="a10-gem-tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99ecff" />
      <stop offset="100%" stop-color="#0080cc" />
    </linearGradient>
    <linearGradient id="a10-gem-bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#004488" />
    </linearGradient>
    <linearGradient id="a10-gem-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#002255" />
    </linearGradient>

    <!-- Gemma Piccola Laterale -->
    <g id="a10-side-gem" filter="url(#a10-center-shadow)">
      <polygon points="0,-24 22,0 0,24 -22,0" fill="url(#a10-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-24 -22,0 -16,0 0,-18" fill="#ffffff" opacity="0.7" />
      <polygon points="0,-15 14,0 0,15 -14,0" fill="#04152e" />
      <polygon points="0,-13 12,0 0,0" fill="#6ee2ff" />
      <polygon points="0,-13 0,0 -12,0" fill="url(#a10-gem-tl)" />
      <polygon points="0,13 12,0 0,0" fill="url(#a10-gem-br)" />
      <polygon points="0,13 0,0 -12,0" fill="url(#a10-gem-bl)" />
    </g>
  </defs>

  <g filter="url(#a10-shadow)">
    <!-- 1. CORNICE ESTERNA DELLA BARRA -->
    <polygon points="54,32 706,32 742,68 742,82 706,118 54,118 18,82 18,68" fill="url(#a10-gold-frame)" stroke="#1c130a" stroke-width="2.2" stroke-linejoin="round" />
    <polyline points="21,68 55,35 705,35 739,68" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />

    <!-- Scanalatura Scura -->
    <polygon points="58,41 702,41 731,70 731,80 702,109 58,109 29,80 29,70" fill="#020b1f" stroke="#36220e" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 2. PIASTRA BLU INTERNA -->
    <polygon points="62,46 698,46 724,72 724,78 698,104 62,104 36,78 36,72" fill="url(#a10-blue-plate)" stroke="#0f4799" stroke-width="2" stroke-linejoin="round" />

    <!-- 3. CANALE INCASSATO (TRACK) -->
    <rect x="86" y="59" width="588" height="32" rx="16" fill="url(#a10-empty-track)" stroke="#1e88e5" stroke-width="2" />
    <rect x="88" y="61" width="584" height="28" rx="14" fill="none" stroke="#010817" stroke-width="2.5" opacity="0.8" />

    <!-- 4. RIEMPIMENTO TURCHESE / CIANO (METÀ SINISTRA) -->
    <rect x="89" y="61.5" width="291" height="27" rx="13.5" fill="url(#a10-cyan-fill)" stroke="#004d40" stroke-width="1.2" />
    <!-- Luce speculare superiore sulla barra turchese -->
    <rect x="100" y="64.5" width="265" height="6" rx="3" fill="#ffffff" opacity="0.65" />

    <!-- 5. GEMME ROMBOIDALI LATERALI ESTREME -->
    <use href="#a10-side-gem" x="34" y="75" />
    <use href="#a10-side-gem" x="726" y="75" />

    <!-- 6. GRANDE GEMMA ROMBOIDALE CENTRALE (CURSORE / DIVISORE) -->
    <g transform="translate(380, 75)" filter="url(#a10-center-shadow)">
      <!-- Castone Esterno Scolpito 3D -->
      <polygon points="0,-58 44,0 0,58 -44,0" fill="url(#a10-gem-gold)" stroke="#1c1004" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Biselli di luce sul castone -->
      <polygon points="0,-58 -44,0 -34,0 0,-45" fill="#ffffff" opacity="0.8" />
      <polygon points="0,-58 44,0 34,0 0,-45" fill="#fff0d4" opacity="0.6" />
      <polygon points="0,58 44,0 34,0 0,45" fill="#593102" opacity="0.75" />

      <!-- Sede Scura della Gemma -->
      <polygon points="0,-41 31,0 0,41 -31,0" fill="#03122b" stroke="#663c0a" stroke-width="1.4" />

      <!-- 4 Faccette Cristalline della Gemma Azzurra -->
      <polygon points="0,-37 -28,0 0,0" fill="url(#a10-gem-tl)" />
      <polygon points="0,-37 28,0 0,0" fill="url(#a10-gem-tr)" />
      <polygon points="0,37 -28,0 0,0" fill="url(#a10-gem-bl)" />
      <polygon points="0,37 28,0 0,0" fill="url(#a10-gem-br)" />

      <!-- Riflesso Centrale Speculare Brillante -->
      <polygon points="0,-28 7,0 0,10 -9,0" fill="#ffffff" opacity="0.9" />
      <line x1="-27" y1="0" x2="27" y2="0" stroke="#aeefff" stroke-width="1.2" opacity="0.7" />
    </g>
  </g>
</svg>