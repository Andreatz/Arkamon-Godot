<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 190" width="100%" height="100%">
  <defs>
    <filter id="a3-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000614" flood-opacity="0.75" />
    </filter>
    <filter id="a3-cart-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#00040f" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a3-gold-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ead7" />
      <stop offset="55%" stop-color="#d4ad7d" />
      <stop offset="88%" stop-color="#9e6f3c" />
      <stop offset="100%" stop-color="#5e3c19" />
    </linearGradient>

    <linearGradient id="a3-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e5" />
      <stop offset="35%" stop-color="#f0be6e" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#693b08" />
    </linearGradient>

    <radialGradient id="a3-blue-panel" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0a3d91" />
      <stop offset="65%" stop-color="#052159" />
      <stop offset="100%" stop-color="#021030" />
    </radialGradient>

    <linearGradient id="a3-blue-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2979ff" />
      <stop offset="50%" stop-color="#0d47a1" />
      <stop offset="100%" stop-color="#062863" />
    </linearGradient>

    <linearGradient id="a3-ivory-cart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f7efe4" />
      <stop offset="88%" stop-color="#d6c6b2" />
      <stop offset="100%" stop-color="#a3907a" />
    </linearGradient>

    <linearGradient id="a3-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <g id="a3-gem" filter="url(#a3-cart-shadow)">
      <polygon points="0,-24 22,0 0,24 -22,0" fill="url(#a3-gem-gold)" stroke="#241406" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-24 -22,0 -16,0 0,-18" fill="#ffffff" opacity="0.7" />
      <polygon points="0,-15 14,0 0,15 -14,0" fill="#04152e" />
      <polygon points="0,-13 12,0 0,13 -12,0" fill="url(#a3-cyan-gem)" />
      <polygon points="0,-13 12,0 0,0" fill="#6ee2ff" opacity="0.75" />
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#e0faff" />
    </g>
  </defs>

  <g filter="url(#a3-shadow)">
    <!-- Cornice Ottagonale Esterna -->
    <polygon points="55,18 155,18 188,51 188,145 155,178 55,178 22,145 22,51" fill="url(#a3-gold-frame)" stroke="#1c130a" stroke-width="2.2" stroke-linejoin="round" />
    <polyline points="24,52 56,21 154,21 186,52" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.85" />

    <!-- Scanalatura Blu Notte -->
    <polygon points="59,28 151,28 178,55 178,141 151,168 59,168 32,141 32,55" fill="#020b1f" stroke="#36220e" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Pannello Ottagonale Blu Reale -->
    <polygon points="63,34 147,34 171,58 171,138 147,162 63,162 39,138 39,58" fill="url(#a3-blue-panel)" stroke="url(#a3-blue-rim)" stroke-width="2.6" stroke-linejoin="round" />

    <!-- Icona Carrello 3D in Avorio -->
    <g filter="url(#a3-cart-shadow)">
      <!-- Manico, Cestello Pieno e Barra Inferiore -->
      <path d="M 62,56 H 77 C 80,56 82,58 83,61 L 85,69 H 144 C 148,69 150,72 149,76 L 139,106 C 138,109 135,111 131,111 H 91 L 92,116 H 134 C 137,116 139,118 139,121 C 139,124 137,126 134,126 H 87 C 83,126 81,123 82,119 L 84,112 L 72,66 H 62 C 59,66 57,64 57,61 C 57,58 59,56 62,56 Z" fill="url(#a3-ivory-cart)" stroke="#24190c" stroke-width="1.8" stroke-linejoin="round" />
      <!-- Bisello interno cestello -->
      <polygon points="88,74 142,74 134,104 94,104" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
      <!-- Ruote 3D -->
      <circle cx="90" cy="137" r="9.5" fill="url(#a3-ivory-cart)" stroke="#24190c" stroke-width="1.8" />
      <circle cx="88" cy="135" r="4" fill="#ffffff" opacity="0.6" />
      <circle cx="127" cy="137" r="9.5" fill="url(#a3-ivory-cart)" stroke="#24190c" stroke-width="1.8" />
      <circle cx="125" cy="135" r="4" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Gemme Laterali Ciano -->
    <use href="#a3-gem" x="26" y="98" />
    <use href="#a3-gem" x="184" y="98" />
  </g>
</svg>