<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <filter id="a13-shadow" x="-6%" y="-15%" width="112%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000614" flood-opacity="0.75" />
    </filter>
    <filter id="a13-gem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#00040d" flood-opacity="0.85" />
    </filter>

    <!-- Gradiente Cilindrico Asta Metallica 3D -->
    <linearGradient id="a13-rod-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2610" />
      <stop offset="18%" stop-color="#ffffff" />
      <stop offset="38%" stop-color="#f5e1c3" />
      <stop offset="65%" stop-color="#b88a56" />
      <stop offset="88%" stop-color="#6e481f" />
      <stop offset="100%" stop-color="#2b1908" />
    </linearGradient>

    <!-- Gradiente Castone Oro Caldo -->
    <linearGradient id="a13-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="32%" stop-color="#f5c97d" />
      <stop offset="72%" stop-color="#bd7c2a" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <!-- Faccette Gemma Ciano -->
    <linearGradient id="a13-cyan-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0faff" />
      <stop offset="60%" stop-color="#4dd2ff" />
      <stop offset="100%" stop-color="#0099e6" />
    </linearGradient>
    <linearGradient id="a13-cyan-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077cc" />
      <stop offset="100%" stop-color="#002b5e" />
    </linearGradient>

    <!-- Gemma Laterale Media -->
    <g id="a13-end-gem" filter="url(#a13-gem-shadow)">
      <polygon points="0,-30 28,0 0,30 -28,0" fill="url(#a13-gem-gold)" stroke="#241305" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-30 -28,0 -21,0 0,-22" fill="#ffffff" opacity="0.75" />
      <polygon points="0,-19 18,0 0,19 -18,0" fill="#04152e" />
      <polygon points="0,-16 -15,0 0,0" fill="url(#a13-cyan-tl)" />
      <polygon points="0,-16 15,0 0,0" fill="#6ee2ff" />
      <polygon points="0,16 -15,0 0,0" fill="#0088cc" />
      <polygon points="0,16 15,0 0,0" fill="url(#a13-cyan-br)" />
      <polygon points="0,-7 6,0 0,7 -6,0" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Grande Gemma Centrale -->
    <g id="a13-center-gem" filter="url(#a13-gem-shadow)">
      <polygon points="0,-46 44,0 0,46 -44,0" fill="url(#a13-gem-gold)" stroke="#241305" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-46 -44,0 -34,0 0,-35" fill="#ffffff" opacity="0.8" />
      <polygon points="0,46 44,0 34,0 0,35" fill="#593102" opacity="0.75" />
      <polygon points="0,-31 29,0 0,31 -29,0" fill="#04152e" stroke="#663c0a" stroke-width="1.2" />
      <polygon points="0,-27 -25,0 0,0" fill="url(#a13-cyan-tl)" />
      <polygon points="0,-27 25,0 0,0" fill="#6ee2ff" />
      <polygon points="0,27 -25,0 0,0" fill="#0088cc" />
      <polygon points="0,27 25,0 0,0" fill="url(#a13-cyan-br)" />
      <polygon points="0,-12 10,0 0,12 -10,0" fill="#e0faff" opacity="0.9" />
    </g>
  </defs>

  <!-- ================================================= -->
  <!-- 1. DIVISORE SUPERIORE LUNGO                       -->
  <!-- ================================================= -->
  <g transform="translate(0, 72)" filter="url(#a13-shadow)">
    <!-- Asta Cilindrica 3D -->
    <rect x="44" y="-9" width="712" height="18" fill="url(#a13-rod-gold)" stroke="#1c1105" stroke-width="1.8" />
    <line x1="48" y1="-4" x2="752" y2="-4" stroke="#ffffff" stroke-width="2" opacity="0.85" />
    <!-- Gemme Estreme e Centrale -->
    <use href="#a13-end-gem" x="44" y="0" />
    <use href="#a13-end-gem" x="756" y="0" />
    <use href="#a13-center-gem" x="400" y="0" />
  </g>

  <!-- ================================================= -->
  <!-- 2. DIVISORE INFERIORE CORTO                       -->
  <!-- ================================================= -->
  <g transform="translate(0, 198)" filter="url(#a13-shadow)">
    <!-- Asta Cilindrica 3D -->
    <rect x="136" y="-8" width="528" height="16" fill="url(#a13-rod-gold)" stroke="#1c1105" stroke-width="1.8" />
    <line x1="140" y1="-3.5" x2="660" y2="-3.5" stroke="#ffffff" stroke-width="1.8" opacity="0.85" />
    <!-- Gemme Estreme e Centrale (Scalate Proporzionalmente) -->
    <use href="#a13-end-gem" x="136" y="0" transform="scale(0.84)" style="transform-origin: 136px 0px;" />
    <use href="#a13-end-gem" x="664" y="0" transform="scale(0.84)" style="transform-origin: 664px 0px;" />
    <use href="#a13-center-gem" x="400" y="0" transform="scale(0.86)" style="transform-origin: 400px 0px;" />
  </g>
</svg>