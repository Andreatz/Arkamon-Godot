<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="100%" height="100%">
  <defs>
    <filter id="shadowEmblems" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="emblemRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Cornice Ottagonale Oro-Avorio -->
    <linearGradient id="octaGoldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f7eed7" />
      <stop offset="55%" stop-color="#c2a06e" />
      <stop offset="80%" stop-color="#e5d1b3" />
      <stop offset="100%" stop-color="#694b22" />
    </linearGradient>

    <linearGradient id="gemGoldBezel8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Canale Ottagonale Blu Zaffiro -->
    <linearGradient id="sapphireChannel8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#042459" />
      <stop offset="100%" stop-color="#02102e" />
    </linearGradient>

    <!-- Simboli Centrali Scolpiti in Avorio 3D (Luce e Ombra) -->
    <linearGradient id="ivoryLight8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f5ebd9" />
      <stop offset="100%" stop-color="#d4be98" />
    </linearGradient>
    <linearGradient id="ivoryShade8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4be98" />
      <stop offset="100%" stop-color="#8c724d" />
    </linearGradient>

    <!-- 8 Gradienti Sfere Elementali -->
    <!-- 1. Normale / Grigio Argento -->
    <radialGradient id="orbNormal" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#a8a29e" />
      <stop offset="65%" stop-color="#57534e" />
      <stop offset="100%" stop-color="#292524" />
    </radialGradient>
    <!-- 2. Elettro / Oro Giallo -->
    <radialGradient id="orbElectric" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <!-- 3. Fuoco / Arancio Rosso -->
    <radialGradient id="orbFire" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="55%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
    <!-- 4. Terra / Ambra Marrone -->
    <radialGradient id="orbEarth" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <!-- 5. Acqua / Azzurro Ceruleo -->
    <radialGradient id="orbWater" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>
    <!-- 6. Erba / Verde Smeraldo -->
    <radialGradient id="orbGrass" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <!-- 7. Buio / Indaco Notte -->
    <radialGradient id="orbDark" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09071a" />
    </radialGradient>
    <!-- 8. Psico / Magenta Viola -->
    <radialGradient id="orbPsychic" cx="45%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="55%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4a044e" />
    </radialGradient>

    <!-- Gemma Cardinale Romboidale -->
    <g id="emblemGem">
      <polygon points="0,-24 24,0 0,24 -24,0" fill="url(#gemGoldBezel8)" stroke="#170f04" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-19 19,0 0,19 -19,0" fill="none" stroke="#fffbeb" stroke-width="0.9" opacity="0.8" />
      <polygon points="0,-15 15,0 0,15 -15,0" fill="#041e30" />
      <polygon points="0,-12.5 12.5,0 0,12.5 -12.5,0" fill="#06b6d4" />
      <polygon points="0,-12.5 12.5,0 0,0" fill="#a5f3fc" />
      <polygon points="0,0 12.5,0 0,12.5" fill="#0284c7" />
      <polygon points="0,-5.5 5.5,0 0,5.5 -5.5,0" fill="#ffffff" />
    </g>

    <!-- Struttura Base Ottagonale dell'Emblema -->
    <g id="octaEmblemBase">
      <!-- Ottagono Esterno Oro-Avorio -->
      <polygon points="-46,-110 46,-110 110,-46 110,46 46,110 -46,110 -110,46 -110,-46" fill="url(#octaGoldFrame)" stroke="#171005" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Canale Ottagonale Blu Zaffiro -->
      <polygon points="-41,-98 41,-98 98,-41 98,41 41,98 -41,98 -98,41 -98,-41" fill="url(#sapphireChannel8)" stroke="#171005" stroke-width="2" stroke-linejoin="round" />
      <polygon points="-38,-92 38,-92 92,-38 92,38 38,92 -38,92 -92,38 -92,-38" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.65" stroke-linejoin="round" />
      <!-- Anello Circolare Interno in Oro-Avorio -->
      <circle cx="0" cy="0" r="82" fill="url(#octaGoldFrame)" stroke="#171005" stroke-width="2" />
    </g>

    <!-- Gruppo 4 Gemme Cardinali -->
    <g id="emblemFourGems">
      <use href="#emblemGem" x="0" y="-106" />
      <use href="#emblemGem" x="106" y="0" />
      <use href="#emblemGem" x="0" y="106" />
      <use href="#emblemGem" x="-106" y="0" />
    </g>
  </defs>

  <g filter="url(#shadowEmblems)">
    <!-- ========================================== -->
    <!-- RIGA 1: NORMALE, ELETTRO, FUOCO, TERRA     -->
    <!-- ========================================== -->

    <!-- 1. NORMALE / STELLA A 4 PUNTE -->
    <g transform="translate(155, 160)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbNormal)" stroke="#1c1917" stroke-width="2" />
      <!-- Stella a 4 Punte Sfaccettata 3D -->
      <g filter="url(#emblemRelief)" stroke="#292014" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="0,-60 16,-16 0,0" fill="url(#ivoryShade8)" />
        <polygon points="0,-60 -16,-16 0,0" fill="url(#ivoryLight8)" />
        <polygon points="60,0 16,-16 0,0" fill="url(#ivoryLight8)" />
        <polygon points="60,0 16,16 0,0" fill="url(#ivoryShade8)" />
        <polygon points="0,60 16,16 0,0" fill="url(#ivoryShade8)" />
        <polygon points="0,60 -16,16 0,0" fill="url(#ivoryLight8)" />
        <polygon points="-60,0 -16,16 0,0" fill="url(#ivoryShade8)" />
        <polygon points="-60,0 -16,-16 0,0" fill="url(#ivoryLight8)" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- 2. ELETTRO / SAETTA -->
    <g transform="translate(425, 160)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbElectric)" stroke="#422006" stroke-width="2" />
      <!-- Archi elettrici sullo sfondo -->
      <path d="M -45,-35 Q -20,-55 10,-45 M 35,-25 Q 55,0 40,35 M -40,25 Q -55,0 -35,-20" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.6" />
      <!-- Saetta Sfaccettata 3D in Avorio -->
      <g filter="url(#emblemRelief)" stroke="#292014" stroke-width="1.8" stroke-linejoin="round">
        <polygon points="22,-58 -32,8 2,8 -18,58 38,-10 4,-10" fill="url(#ivoryLight8)" />
        <polygon points="22,-58 4,-10 38,-10 -18,58 0,0" fill="url(#ivoryShade8)" stroke="none" opacity="0.55" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- 3. FUOCO / FIAMMA -->
    <g transform="translate(695, 160)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbFire)" stroke="#450a0a" stroke-width="2" />
      <!-- Lingue di fuoco sullo sfondo -->
      <path d="M -48,20 C -58,-10 -35,-45 0,-55 C 35,-45 58,-10 48,20" fill="none" stroke="#fde047" stroke-width="3" opacity="0.45" filter="blur(2px)" />
      <!-- Fiamma 3D Scolpita in Avorio -->
      <g filter="url(#emblemRelief)">
        <path d="M -8,54 C -34,42 -42,12 -32,-12 C -26,-24 -18,-30 -18,-30 C -18,-18 -12,-12 -8,-16 C -14,-36 -2,-52 6,-60 C 20,-42 26,-20 20,0 C 26,-4 30,-14 28,-22 C 42,-6 46,18 34,38 C 26,50 14,54 4,54 C 12,42 14,26 6,14 C 4,24 -2,28 -6,24 C 0,10 -6,-4 -6,-4 C -14,10 -22,22 -16,38 C -14,46 -8,54 -8,54 Z" fill="url(#ivoryLight8)" stroke="#292014" stroke-width="2" stroke-linejoin="round" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- 4. TERRA / MONTAGNA -->
    <g transform="translate(965, 160)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbEarth)" stroke="#291504" stroke-width="2" />
      <!-- Montagna a Doppio Scaglione 3D in Avorio -->
      <g filter="url(#emblemRelief)" stroke="#292014" stroke-width="1.8" stroke-linejoin="round">
        <!-- Vetta Superiore Principale -->
        <polygon points="0,-46 -52,16 -34,26 0,-12 34,26 52,16" fill="url(#ivoryLight8)" />
        <polygon points="0,-46 52,16 34,26 0,-12" fill="url(#ivoryShade8)" />
        <!-- Vetta Laterale Destra -->
        <polygon points="32,-20 12,2 44,30 56,16" fill="url(#ivoryShade8)" />
        <!-- Scaglione Inferiore (Base Rocciosa) -->
        <polygon points="0,-2 -44,32 -24,44 0,24 24,44 44,32" fill="url(#ivoryLight8)" />
        <polygon points="0,-2 44,32 24,44 0,24" fill="url(#ivoryShade8)" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- ========================================== -->
    <!-- RIGA 2: ACQUA, ERBA, BUIO, PSICO           -->
    <!-- ========================================== -->

    <!-- 5. ACQUA / GOCCIA E ONDA -->
    <g transform="translate(155, 440)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbWater)" stroke="#082f49" stroke-width="2" />
      <!-- Goccia d'Acqua 3D in Avorio + Onda Azzurra -->
      <g filter="url(#emblemRelief)">
        <path d="M 0,-56 C 12,-28 32,-2 32,16 C 32,34 18,46 0,46 C -18,46 -32,34 -32,16 C -32,-2 -12,-28 0,-56 Z" fill="url(#ivoryLight8)" stroke="#292014" stroke-width="2" stroke-linejoin="round" />
        <path d="M -18,12 C -18,24 -10,34 0,36" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <!-- Onda Fluida Sottostante -->
        <path d="M -42,38 C -26,26 -12,38 4,46 C 20,54 34,42 46,30 C 38,52 16,64 -4,54 C -20,46 -32,42 -42,38 Z" fill="#7dd3fc" stroke="#082f49" stroke-width="1.8" stroke-linejoin="round" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- 6. ERBA / FOGLIA -->
    <g transform="translate(425, 440)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbGrass)" stroke="#052e16" stroke-width="2" />
      <!-- Foglioline verdi di contorno -->
      <path d="M -32,42 C -52,32 -56,6 -42,-12 C -38,8 -28,24 -32,42 Z" fill="#4ade80" opacity="0.75" />
      <path d="M 28,44 C 48,36 56,12 44,-6 C 38,12 28,28 28,44 Z" fill="#4ade80" opacity="0.75" />
      <!-- Grande Foglia Centrale Scolpita in Avorio 3D -->
      <g filter="url(#emblemRelief)">
        <path d="M -18,54 C -26,22 -18,-18 28,-48 C 36,-6 22,34 -18,54 Z" fill="url(#ivoryLight8)" stroke="#292014" stroke-width="2" stroke-linejoin="round" />
        <!-- Nervatura incisa -->
        <path d="M -16,50 C -6,22 6,-4 22,-36 M -4,18 L 12,8 M -8,-2 L 4,-12" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- 7. BUIO / LUNA CRESCENTE -->
    <g transform="translate(695, 440)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbDark)" stroke="#09071a" stroke-width="2" />
      <!-- Alone viola cosmico interno -->
      <circle cx="14" cy="0" r="32" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.5" filter="blur(2px)" />
      <!-- Luna Crescente Scolpita in Avorio 3D -->
      <g filter="url(#emblemRelief)">
        <path d="M 28,-42 C -8,-52 -42,-24 -42,12 C -42,46 -8,64 28,46 C 32,44 36,40 38,36 C 10,44 -16,26 -16,-2 C -16,-26 6,-42 28,-42 Z" fill="url(#ivoryLight8)" stroke="#292014" stroke-width="2" stroke-linejoin="round" />
      </g>
      <use href="#emblemFourGems" />
    </g>

    <!-- 8. PSICO / OCCHIO ARCANO CON SPIRALE -->
    <g transform="translate(965, 440)">
      <use href="#octaEmblemBase" />
      <circle cx="0" cy="0" r="73" fill="url(#orbPsychic)" stroke="#2e1065" stroke-width="2" />
      <!-- Occhio Mistico con Punte Verticali e Pupilla a Spirale in Avorio 3D -->
      <g filter="url(#emblemRelief)" stroke="#292014" stroke-width="1.8" stroke-linejoin="round">
        <!-- Punte Verticali Superiore e Inferiore -->
        <polygon points="0,-58 -10,-28 10,-28" fill="url(#ivoryLight8)" />
        <polygon points="0,58 -10,28 10,28" fill="url(#ivoryShade8)" />
        <!-- Contorno a Mandorla dell'Occhio -->
        <path fill-rule="evenodd" d="M -62,0 C -34,-38 34,-38 62,0 C 34,38 -34,38 -62,0 Z 
                 M -42,0 C -20,-24 20,-24 42,0 C 20,24 -20,24 -42,0 Z" fill="url(#ivoryLight8)" />
        <!-- Pupilla Centrale a Spirale -->
        <path d="M 0,4 C 5,4 7,-2 4,-6 C 0,-12 -10,-10 -12,-2 C -16,10 -4,20 8,18 C 22,16 28,-2 20,-16 C 12,-26 -6,-28 -18,-18" fill="none" stroke="url(#ivoryLight8)" stroke-width="6" stroke-linecap="round" />
      </g>
      <use href="#emblemFourGems" />
    </g>
  </g>
</svg>