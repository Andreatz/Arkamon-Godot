<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" width="100%" height="100%">
  <defs>
    <filter id="a34-shadow" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#000614" flood-opacity="0.85" />
    </filter>
    <filter id="a34-elem-shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#00040f" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a34-gold-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#d1ad80" />
      <stop offset="85%" stop-color="#946b3b" />
      <stop offset="100%" stop-color="#4d3214" />
    </linearGradient>

    <linearGradient id="a34-gem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" />
      <stop offset="35%" stop-color="#f2c06d" />
      <stop offset="75%" stop-color="#b87624" />
      <stop offset="100%" stop-color="#5e3404" />
    </linearGradient>

    <!-- Canale Blu Reale Venato -->
    <linearGradient id="a34-royal-channel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="35%" stop-color="#05235c" />
      <stop offset="70%" stop-color="#0a3d91" />
      <stop offset="100%" stop-color="#031338" />
    </linearGradient>

    <!-- Piastra Targhetta Bianco Perla -->
    <linearGradient id="a34-plate-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f0f3f8" />
      <stop offset="100%" stop-color="#ced6e2" />
    </linearGradient>

    <radialGradient id="a34-gold-stud" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9db" />
      <stop offset="40%" stop-color="#f7b733" />
      <stop offset="85%" stop-color="#b56207" />
      <stop offset="100%" stop-color="#592c00" />
    </radialGradient>

    <linearGradient id="a34-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <!-- Grande Gemma Angolare della Cornice -->
    <g id="a34-corner-gem" filter="url(#a34-elem-shadow)">
      <polygon points="0,-36 36,0 0,36 -36,0" fill="url(#a34-gem-gold)" stroke="#1f1105" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-36 -36,0 -27,0 0,-27" fill="#ffffff" opacity="0.8" />
      <polygon points="0,36 36,0 27,0 0,27" fill="#593102" opacity="0.75" />
      <polygon points="0,-24 24,0 0,24 -24,0" fill="#03122b" stroke="#663c0a" stroke-width="1.2" />
      <polygon points="0,-21 -21,0 0,0" fill="#80e5ff" />
      <polygon points="0,-21 21,0 0,0" fill="#00b4fc" />
      <polygon points="0,21 -21,0 0,0" fill="#0088cc" />
      <polygon points="0,21 21,0 0,0" fill="#004d80" />
      <polygon points="0,-9 9,0 0,9 -9,0" fill="#e0faff" opacity="0.9" />
    </g>

    <!-- Gemma Laterale della Targhetta Inferiore -->
    <g id="a34-badge-gem" filter="url(#a34-elem-shadow)">
      <polygon points="0,-22 20,0 0,22 -20,0" fill="url(#a34-gem-gold)" stroke="#1f1105" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-14 13,0 0,14 -13,0" fill="#03122b" />
      <polygon points="0,-12 11,0 0,12 -11,0" fill="url(#a34-cyan-gem)" />
      <polygon points="0,-5 4.5,0 0,5 -4.5,0" fill="#e0faff" />
    </g>
  </defs>

  <g filter="url(#a34-shadow)">
    <!-- ========================================================= -->
    <!-- 1. CORNICE QUADRATA CON APERTURA CENTRALE TRASPARENTE     -->
    <!-- ========================================================= -->
    <!-- Struttura Metallica Oro Champagne Esterna + Interna (Forata con fill-rule="evenodd") -->
    <path d="M 52,20 H 448 L 468,40 V 412 L 448,432 H 52 L 32,412 V 40 Z
             M 84,54 L 66,72 V 380 L 84,398 H 416 L 434,380 V 72 L 416,54 Z" fill="url(#a34-gold-frame)" fill-rule="evenodd" stroke="#1c130a" stroke-width="2.4" stroke-linejoin="round" />

    <!-- Canale Intermedio in Blu Reale Venato -->
    <path d="M 58,28 H 442 L 458,44 V 408 L 442,424 H 58 L 42,408 V 44 Z
             M 80,46 L 58,68 V 384 L 80,406 H 420 L 442,384 V 68 L 420,46 Z" fill="url(#a34-royal-channel)" fill-rule="evenodd" stroke="#020b1f" stroke-width="2" stroke-linejoin="round" />

    <!-- Riflessi elettrici blu lungo il canale -->
    <path d="M 95,37 H 405 M 95,415 H 405 M 50,95 V 355 M 450,95 V 355" stroke="#2979ff" stroke-width="2" opacity="0.65" stroke-linecap="round" />

    <!-- Filetto d'oro interno attorno all'apertura trasparente -->
    <polygon points="84,54 416,54 434,72 434,380 416,398 84,398 66,380 66,72" fill="none" stroke="#fff6e6" stroke-width="1.8" opacity="0.9" />

    <!-- 4 Grandi Gemme Romboidali sugli Angoli della Cornice -->
    <use href="#a34-corner-gem" x="62" y="50" />
    <use href="#a34-corner-gem" x="438" y="50" />
    <use href="#a34-corner-gem" x="62" y="402" />
    <use href="#a34-corner-gem" x="438" y="402" />

    <!-- ========================================================= -->
    <!-- 2. TARGHETTA / BANNER INFERIORE                           -->
    <!-- ========================================================= -->
    <g transform="translate(0, 444)" filter="url(#a34-elem-shadow)">
      <!-- Estensioni Blu/Oro Laterali -->
      <polygon points="108,0 392,0 418,34 392,68 108,68 82,34" fill="url(#a34-gold-frame)" stroke="#1c130a" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="113,7 387,7 408,34 387,61 113,61 92,34" fill="#041a42" stroke="#1e88e5" stroke-width="1.6" stroke-linejoin="round" />

      <!-- Piastra Centrale Esagonale Bianco-Perla -->
      <polygon points="126,7 374,7 394,34 374,61 126,61 106,34" fill="url(#a34-gold-frame)" stroke="#1c130a" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="130,13 370,13 386,34 370,55 130,55 114,34" fill="url(#a34-plate-white)" stroke="#8c9bae" stroke-width="1.4" stroke-linejoin="round" />
      <polyline points="117,34 131,16 369,16" fill="none" stroke="#ffffff" stroke-width="2" />

      <!-- 2 Rivetti Dorati Interni -->
      <circle cx="132" cy="34" r="7.5" fill="url(#a34-gold-stud)" stroke="#2b1400" stroke-width="1.4" />
      <circle cx="368" cy="34" r="7.5" fill="url(#a34-gold-stud)" stroke="#2b1400" stroke-width="1.4" />

      <!-- 2 Gemme Romboidali Laterali della Targhetta -->
      <use href="#a34-badge-gem" x="92" y="34" />
      <use href="#a34-badge-gem" x="408" y="34" />
    </g>
  </g>
</svg>