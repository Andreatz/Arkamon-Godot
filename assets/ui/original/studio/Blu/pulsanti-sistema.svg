<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 190" width="100%" height="100%">
  <defs>
    <filter id="a37-shadow" x="-6%" y="-10%" width="112%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000614" flood-opacity="0.8" />
    </filter>
    <filter id="a37-sym-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#00040d" flood-opacity="0.9" />
    </filter>

    <linearGradient id="a37-gold-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#f7ebd9" />
      <stop offset="55%" stop-color="#e0ae6c" />
      <stop offset="88%" stop-color="#9e6424" />
      <stop offset="100%" stop-color="#54300a" />
    </linearGradient>

    <radialGradient id="a37-navy-disc" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#093070" />
      <stop offset="65%" stop-color="#041942" />
      <stop offset="100%" stop-color="#01091c" />
    </radialGradient>

    <linearGradient id="a37-ivory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f7efe4" />
      <stop offset="90%" stop-color="#d4c3ae" />
      <stop offset="100%" stop-color="#9e8a72" />
    </linearGradient>

    <linearGradient id="a37-cyan-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aef4ff" />
      <stop offset="45%" stop-color="#00b4fc" />
      <stop offset="100%" stop-color="#004d80" />
    </linearGradient>

    <!-- Gemma Cardinale Piccola -->
    <g id="a37-gem" filter="url(#a37-sym-shadow)">
      <polygon points="0,-16 14,0 0,16 -14,0" fill="url(#a37-gold-rim)" stroke="#241406" stroke-width="1.4" stroke-linejoin="round" />
      <polygon points="0,-10 8.5,0 0,10 -8.5,0" fill="#04152e" />
      <polygon points="0,-8.5 7,0 0,8.5 -7,0" fill="url(#a37-cyan-gem)" />
      <polygon points="0,-3.5 3,0 0,3.5 -3,0" fill="#e0faff" />
    </g>

    <!-- Base Pulsante Circolare con 4 Gemme -->
    <g id="a37-circle-btn">
      <circle cx="0" cy="0" r="64" fill="url(#a37-gold-rim)" stroke="#1c130a" stroke-width="2" />
      <path d="M -52,-28 A 59,59 0 0,1 52,-28" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.85" stroke-linecap="round" />
      <circle cx="0" cy="0" r="54" fill="url(#a37-navy-disc)" stroke="#1565c0" stroke-width="2" />
      <use href="#a37-gem" x="0" y="-62" />
      <use href="#a37-gem" x="0" y="62" />
      <use href="#a37-gem" x="-62" y="0" />
      <use href="#a37-gem" x="62" y="0" />
    </g>
  </defs>

  <g filter="url(#a37-shadow)">
    <!-- 1. SALVA / FLOPPY DISK -->
    <g transform="translate(82, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.6" stroke-linejoin="round">
        <path d="M -24,-26 H 14 L 24,-16 V 24 C 24,26 22,28 20,28 H -24 C -26,28 -28,26 -28,24 V -22 C -28,-24 -26,-26 -24,-26 Z" />
        <rect x="-14" y="-26" width="22" height="15" fill="#041942" />
        <rect x="-4" y="-24" width="7" height="11" fill="url(#a37-ivory)" />
        <rect x="-17" y="6" width="30" height="16" rx="2" fill="#041942" />
        <line x1="-12" y1="14" x2="8" y2="14" stroke="url(#a37-ivory)" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>

    <!-- 2. CARTELLA / FOLDER -->
    <g transform="translate(238, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.6" stroke-linejoin="round">
        <path d="M -28,-22 H -6 L 0,-14 H 24 V 20 H -28 Z" fill="#cbb9a3" />
        <polygon points="-28,20 -20,-6 30,-6 22,20" />
      </g>
    </g>

    <!-- 3. RICARICA / REFRESH -->
    <g transform="translate(394, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)">
        <path d="M 18,4 A 20,20 0 1,1 11,-15 L 5,-9 H 23 V -27 L 17,-21 A 28,28 0 1,0 26,4 Z" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.6" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 4. PAUSA (||) -->
    <g transform="translate(550, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.6">
        <rect x="-18" y="-24" width="12" height="48" rx="3" />
        <rect x="6" y="-24" width="12" height="48" rx="3" />
      </g>
    </g>

    <!-- 5. PLAY (▶) -->
    <g transform="translate(706, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)">
        <polygon points="-16,-25 24,0 -16,25" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.8" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 6. VOLUME ATTIVO -->
    <g transform="translate(862, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="-26,-10 -12,-10 4,-24 4,24 -12,10 -26,10" />
        <path d="M 12,-12 A 16,16 0 0,1 12,12" fill="none" stroke="url(#a37-ivory)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 20,-21 A 27,27 0 0,1 20,21" fill="none" stroke="url(#a37-ivory)" stroke-width="4.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 7. MUTO (SPEAKER CON BARRA ROSSA) -->
    <g transform="translate(1018, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)">
        <polygon points="-24,-10 -10,-10 6,-24 6,24 -10,10 -24,10" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.5" stroke-linejoin="round" />
        <line x1="-14" y1="-24" x2="26" y2="22" stroke="#ff5252" stroke-width="6.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 8. NOTA MUSICALE (♫) -->
    <g transform="translate(1174, 95)">
      <use href="#a37-circle-btn" />
      <g filter="url(#a37-sym-shadow)" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.5" stroke-linejoin="round">
        <path d="M -8,18 V -20 L 22,-26 V 12 H 15 V -14 L -1,-10 V 18 Z" />
        <ellipse cx="-14" cy="18" rx="9" ry="7" transform="rotate(-15 -14 18)" />
        <ellipse cx="16" cy="12" rx="9" ry="7" transform="rotate(-15 16 12)" />
      </g>
    </g>

    <!-- 9. SCHERMO INTERO / FULLSCREEN (PULSANTE PIÙ GRANDE A DESTRA) -->
    <g transform="translate(1346, 95)">
      <rect x="-70" y="-70" width="140" height="140" rx="52" fill="url(#a37-gold-rim)" stroke="#1c130a" stroke-width="2.2" />
      <rect x="-60" y="-60" width="120" height="120" rx="44" fill="url(#a37-navy-disc)" stroke="#1565c0" stroke-width="2.2" />
      <!-- 4 Squadrette Schermo Intero -->
      <g filter="url(#a37-sym-shadow)" fill="url(#a37-ivory)" stroke="#14181f" stroke-width="1.4" stroke-linejoin="round">
        <path d="M -26,-26 H -8 V -17 H -17 V -8 H -26 Z" />
        <path d="M 26,-26 H 8 V -17 H 17 V -8 H 26 Z" />
        <path d="M -26,26 H -8 V 17 H -17 V 8 H -26 Z" />
        <path d="M 26,26 H 8 V 17 H 17 V 8 H 26 Z" />
      </g>
      <use href="#a37-gem" x="0" y="-68" transform="scale(1.1)" style="transform-origin: 0px -68px;" />
      <use href="#a37-gem" x="0" y="68" transform="scale(1.1)" style="transform-origin: 0px 68px;" />
      <use href="#a37-gem" x="-68" y="0" transform="scale(1.1)" style="transform-origin: -68px 0px;" />
      <use href="#a37-gem" x="68" y="0" transform="scale(1.1)" style="transform-origin: 68px 0px;" />
    </g>
  </g>
</svg>