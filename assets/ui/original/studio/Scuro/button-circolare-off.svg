<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="shadowOff" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Anello Bombato in Bronzo / Oro Champagne (Stile percorso.svg) -->
    <linearGradient id="bronzeRing8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9f2" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#b07d5b" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Vetro Blu Ardesia Scuro per Fascia e Nucleo -->
    <radialGradient id="slateCore8" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e2d42" />
      <stop offset="65%" stop-color="#0f1724" />
      <stop offset="100%" stop-color="#060a12" />
    </radialGradient>
  </defs>

  <g filter="url(#shadowOff)" transform="translate(120, 120)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="96" fill="url(#bronzeRing8)" stroke="#1c0f07" stroke-width="2.5" />
    <!-- Riflesso curvo superiore anello esterno -->
    <path d="M -78,-45 A 90,90 0 0,1 78,-45" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- 2. FASCIA CIRCOLARE INTERMEDIA BLU ARDESIA -->
    <circle cx="0" cy="0" r="78" fill="url(#slateCore8)" stroke="#1c0f07" stroke-width="2.2" />
    <!-- Filetto di riflesso inferiore sulla fascia intermedia -->
    <path d="M -62,36 A 71,71 0 0,0 62,36" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.45" />

    <!-- 3. ANELLO INTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="59" fill="url(#bronzeRing8)" stroke="#1c0f07" stroke-width="2.2" />
    <!-- Riflesso curvo superiore anello interno -->
    <path d="M -46,-28 A 53,53 0 0,1 46,-28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85" />

    <!-- 4. CAVITÀ CENTRALE BLU ARDESIA PROFONDO (STATO OFF) -->
    <circle cx="0" cy="0" r="44" fill="url(#slateCore8)" stroke="#140b05" stroke-width="2.2" />
    <!-- Ombra concava interna e riflesso inferiore -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#04070d" stroke-width="4" opacity="0.7" />
    <path d="M -28,26 A 38,38 0 0,0 28,26" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />
  </g>
</svg>