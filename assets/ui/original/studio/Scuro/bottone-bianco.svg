<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <filter id="shadow29" x="-6%" y="-12%" width="112%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Cornice Esterna Blu Ardesia Metallico -->
    <linearGradient id="slateFrame29" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b657d"/>
      <stop offset="25%" stop-color="#27374d"/>
      <stop offset="50%" stop-color="#101824"/>
      <stop offset="80%" stop-color="#27374d"/>
      <stop offset="100%" stop-color="#0d131a"/>
    </linearGradient>

    <!-- Bronzo / Oro Rosa (da percorso_2.svg) -->
    <linearGradient id="bronzeMain29" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6"/>
      <stop offset="22%" stop-color="#e5bfa0"/>
      <stop offset="52%" stop-color="#8c5c3e"/>
      <stop offset="82%" stop-color="#c99673"/>
      <stop offset="100%" stop-color="#5e3a22"/>
    </linearGradient>

    <!-- Smusso Acciaio Chiaro per la Lastra Interna -->
    <linearGradient id="iceBevel29" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Piano Centrale Bianco Perla / Avorio -->
    <linearGradient id="pearlCore29" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#dbe4ee"/>
    </linearGradient>

    <clipPath id="pearlClip29">
      <polygon points="136,53 744,53 782,91 782,119 744,157 136,157 98,119 98,91"/>
    </clipPath>

    <!-- Gemma Laterale Romboidale (Stile percorso_2.svg) -->
    <g id="sideGem29">
      <polygon points="0,-40 40,0 0,40 -40,0" fill="url(#bronzeMain29)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="0,-34 34,0 0,34 -34,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75"/>
      <polygon points="0,-28 28,0 0,28 -28,0" fill="#07101e" stroke="#1e130c" stroke-width="1"/>
      <polygon points="0,-22 22,0 0,22 -22,0" fill="#0ea5e9"/>
      <polygon points="0,-22 22,0 0,0" fill="#7dd3fc"/>
      <polygon points="0,0 22,0 0,22" fill="#0284c7"/>
      <polygon points="0,-10 10,0 0,10 -10,0" fill="#e0f2fe"/>
    </g>
  </defs>

  <g filter="url(#shadow29)">
    <!-- 1. CORNICE ESTERNA IN ACCIAIO ARDESIA SCURO -->
    <path d="M 118,22 L 762,22 Q 792,22 812,46 L 844,86 Q 858,105 844,124 L 812,164 Q 792,188 762,188 L 118,188 Q 88,188 68,164 L 36,124 Q 22,105 36,86 L 68,46 Q 88,22 118,22 Z" 
          fill="url(#slateFrame29)" stroke="#090d14" stroke-width="2.2"/>

    <!-- Inserti Angolari Curvi in Bronzo/Oro Rosa (Stile percorso_2.svg) -->
    <path d="M 122,22 Q 88,22 68,46 L 42,78 L 53,86 L 78,54 Q 95,33 126,33 Z" fill="url(#bronzeMain29)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 122,188 Q 88,188 68,164 L 42,132 L 53,124 L 78,156 Q 95,177 126,177 Z" fill="url(#bronzeMain29)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 758,22 Q 792,22 812,46 L 838,78 L 827,86 L 802,54 Q 785,33 754,33 Z" fill="url(#bronzeMain29)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 758,188 Q 792,188 812,164 L 838,132 L 827,124 L 802,156 Q 785,177 754,177 Z" fill="url(#bronzeMain29)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Trincea Scura Incassata -->
    <path d="M 124,33 L 756,33 Q 782,33 798,52 L 826,88 Q 838,105 826,122 L 798,158 Q 782,177 756,177 L 124,177 Q 98,177 82,158 L 54,122 Q 42,105 54,88 L 82,52 Q 98,33 124,33 Z" 
          fill="#070b12" stroke="#05080d" stroke-width="1.5"/>

    <!-- 2. LASTRA INTERNA BIANCO PERLA SMUSSATA -->
    <polygon points="128,42 752,42 798,88 798,122 752,168 128,168 82,122 82,88" 
             fill="url(#iceBevel29)" stroke="#4b657d" stroke-width="1.5" stroke-linejoin="round"/>

    <polygon points="136,53 744,53 782,91 782,119 744,157 136,157 98,119 98,91" 
             fill="url(#pearlCore29)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>

    <!-- Linee Diagonali di Riflesso Sottili sulla Lastra Chiara -->
    <g clip-path="url(#pearlClip29)" stroke="#64748b" stroke-width="1.2" opacity="0.12">
      <line x1="175" y1="53" x2="245" y2="157"/>
      <line x1="205" y1="53" x2="275" y2="157"/>
      <line x1="705" y1="53" x2="635" y2="157"/>
      <line x1="675" y1="53" x2="605" y2="157"/>
    </g>

    <!-- Piccoli Rombi Decorativi Interni -->
    <g transform="translate(124, 105)">
      <polygon points="0,-8.5 8.5,0 0,8.5 -8.5,0" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.2" fill="#0ea5e9"/>
    </g>
    <g transform="translate(756, 105)">
      <polygon points="0,-8.5 8.5,0 0,8.5 -8.5,0" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.2" fill="#0ea5e9"/>
    </g>

    <!-- 3. GEMME LATERALI SINISTRA E DESTRA -->
    <use href="#sideGem29" x="58" y="105"/>
    <use href="#sideGem29" x="822" y="105"/>
  </g>
</svg>
