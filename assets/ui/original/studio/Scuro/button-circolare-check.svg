<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="shadowCheck" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <linearGradient id="bronzeRing7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#b07d5b" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <radialGradient id="slateDisc7" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#22354f" />
      <stop offset="65%" stop-color="#121c2b" />
      <stop offset="100%" stop-color="#090e17" />
    </radialGradient>

    <!-- Gradiente Spunta Avorio 3D -->
    <linearGradient id="ivoryCheck7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f5ebe0" />
      <stop offset="100%" stop-color="#d6c4b0" />
    </linearGradient>

    <g id="cardinalGem7">
      <polygon points="0,-29 29,0 0,29 -29,0" fill="url(#bronzeRing7)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-24 24,0 0,24 -24,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-19 19,0 0,19 -19,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#0ea5e9" />
      <polygon points="0,-16 16,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 16,0 0,16" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowCheck)" transform="translate(140, 140)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="106" fill="url(#bronzeRing7)" stroke="#1c0f07" stroke-width="2.5" />
    <path d="M -86,-52 A 99,99 0 0,1 86,-52" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- 2. TRINCEA SCURA E DISCO INTERNO BLU ARDESIA -->
    <circle cx="0" cy="0" r="84" fill="#070b12" stroke="#1c0f07" stroke-width="2" />
    <circle cx="0" cy="0" r="78" fill="url(#slateDisc7)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.65" />

    <!-- Archi Luminosi Interni -->
    <path d="M -58,-38 A 69,69 0 0,1 58,-38" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M -52,44 A 68,68 0 0,0 52,44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.45" />

    <!-- 3. ICONA SPUNTA (CHECKMARK) 3D IN AVORIO CON SMUSSO -->
    <g>
      <!-- Ombra portata della spunta -->
      <path d="M -46,2 Q -52,8 -46,14 L -14,46 Q -8,52 -2,46 L 54,-14 Q 60,-20 54,-26 L 38,-42 Q 32,-48 26,-42 L -8,-6 L -24,-22 Q -30,-28 -36,-22 Z" transform="translate(0, 6)" fill="#05080f" opacity="0.8" />
      <!-- Smusso inferiore 3D della spunta -->
      <path d="M -46,2 Q -52,8 -46,14 L -14,46 Q -8,52 -2,46 L 54,-14 Q 60,-20 54,-26 L 38,-42 Q 32,-48 26,-42 L -8,-6 L -24,-22 Q -30,-28 -36,-22 Z" fill="#b8a38e" stroke="#1c110a" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Faccia superiore illuminata della spunta -->
      <path d="M -43,0 L -32,-14 L -8,10 L 32,-34 L 46,-20 L -8,36 Z" fill="url(#ivoryCheck7)" />
      <!-- Riflesso bianco nitido sul filo superiore -->
      <polyline points="-41,1 -31,-11 -8,12 32,-31 44,-19" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 4. QUATTRO GEMME SUI PUNTI CARDINALI -->
    <use href="#cardinalGem7" x="0" y="-98" />
    <use href="#cardinalGem7" x="98" y="0" />
    <use href="#cardinalGem7" x="0" y="98" />
    <use href="#cardinalGem7" x="-98" y="0" />
  </g>
</svg>