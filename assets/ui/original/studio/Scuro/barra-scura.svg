<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" width="100%" height="100%">
  <defs>
    <filter id="shadow22" x="-5%" y="-12%" width="110%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Bronzo / Oro Rosa (da percorso_2.svg) -->
    <linearGradient id="bronzeMain22" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6"/>
      <stop offset="22%" stop-color="#e5bfa0"/>
      <stop offset="52%" stop-color="#8c5c3e"/>
      <stop offset="82%" stop-color="#c99673"/>
      <stop offset="100%" stop-color="#5e3a22"/>
    </linearGradient>

    <linearGradient id="trenchDark22" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c110a"/>
      <stop offset="50%" stop-color="#2e1d13"/>
      <stop offset="100%" stop-color="#140c07"/>
    </linearGradient>

    <!-- Lastra Blu Ardesia Scuro -->
    <linearGradient id="slateBoard22" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101824"/>
      <stop offset="50%" stop-color="#1f2d40"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>

    <!-- Smusso Interno Acciaio-Blu (da percorso_2.svg) -->
    <linearGradient id="steelBevel22" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#607d96"/>
      <stop offset="50%" stop-color="#364b61"/>
      <stop offset="100%" stop-color="#4b657d"/>
    </linearGradient>

    <clipPath id="boardClip22">
      <polygon points="104,46 816,46 850,80 850,110 816,144 104,144 70,110 70,80"/>
    </clipPath>

    <!-- Gemma Laterale Romboidale (Stile percorso_2.svg) -->
    <g id="sideGem22">
      <polygon points="0,-36 36,0 0,36 -36,0" fill="url(#bronzeMain22)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round"/>
      <polygon points="0,-30 30,0 0,30 -30,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75"/>
      <polygon points="0,-24 24,0 0,24 -24,0" fill="#07101e" stroke="#1e130c" stroke-width="1"/>
      <polygon points="0,-19 19,0 0,19 -19,0" fill="#0ea5e9"/>
      <polygon points="0,-19 19,0 0,0" fill="#7dd3fc"/>
      <polygon points="0,0 19,0 0,19" fill="#0284c7"/>
      <polygon points="0,-9 9,0 0,9 -9,0" fill="#e0f2fe"/>
    </g>
  </defs>

  <g filter="url(#shadow22)">
    <!-- 1. CORNICE OTTAGONALE ESTERNA IN BRONZO -->
    <polygon points="88,22 832,22 882,72 882,118 832,168 88,168 38,118 38,72" 
             fill="url(#bronzeMain22)" stroke="#24130a" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="90,26 830,26 878,74" fill="none" stroke="#fff3e6" stroke-width="1.2" opacity="0.8"/>

    <!-- 2. TRINCEA SCURA INCASSATA -->
    <polygon points="94,31 826,31 871,76 871,114 826,159 94,159 49,114 49,76" 
             fill="url(#trenchDark22)" stroke="#140c07" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 3. FILETTO LUMINOSO E SMUSSO INTERNO ACCIAIO-BLU -->
    <polygon points="99,38 821,38 862,79 862,111 821,152 99,152 58,111 58,79" 
             fill="url(#steelBevel22)" stroke="#f5d5b8" stroke-width="2" stroke-linejoin="round"/>

    <!-- 4. LASTRA INTERNA BLU ARDESIA SCURO -->
    <polygon points="105,46 815,46 850,81 850,109 815,144 105,144 70,109 70,81" 
             fill="url(#slateBoard22)" stroke="#0d131a" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Linee Diagonali di Riflesso (Stile percorso_2.svg) -->
    <g clip-path="url(#boardClip22)" stroke="#ffffff" stroke-width="1.2" opacity="0.06">
      <line x1="150" y1="46" x2="215" y2="144"/>
      <line x1="180" y1="46" x2="245" y2="144"/>
      <line x1="770" y1="46" x2="705" y2="144"/>
      <line x1="740" y1="46" x2="675" y2="144"/>
    </g>

    <!-- Piccoli Rombi Decorativi Interni con Punto Ciano -->
    <g transform="translate(102, 95)">
      <polygon points="0,-8.5 8.5,0 0,8.5 -8.5,0" fill="none" stroke="#7c93ab" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.2" fill="#38bdf8"/>
    </g>
    <g transform="translate(818, 95)">
      <polygon points="0,-8.5 8.5,0 0,8.5 -8.5,0" fill="none" stroke="#7c93ab" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2.2" fill="#38bdf8"/>
    </g>

    <!-- 5. GEMME LATERALI SINISTRA E DESTRA -->
    <use href="#sideGem22" x="48" y="95"/>
    <use href="#sideGem22" x="872" y="95"/>
  </g>
</svg>
