<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 210" width="100%" height="100%">
  <defs>
    <filter id="shadowSys" x="-3%" y="-10%" width="106%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="sysIconDrop7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#05080f" flood-opacity="0.85" />
    </filter>

    <!-- Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeRing7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Disco Interno Blu Ardesia Scuro -->
    <radialGradient id="slateDisc7" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#22354f" />
      <stop offset="65%" stop-color="#121c2b" />
      <stop offset="100%" stop-color="#090e17" />
    </radialGradient>

    <!-- Icone Scolpite in Avorio 3D -->
    <linearGradient id="ivorySys7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5ebe0" />
      <stop offset="100%" stop-color="#cbb8a3" />
    </linearGradient>

    <!-- Gemma Cardinale Piccola -->
    <g id="gemSys7">
      <polygon points="0,-20 20,0 0,20 -20,0" fill="url(#bronzeRing7)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="none" stroke="#fff3e6" stroke-width="0.8" opacity="0.75" />
      <polygon points="0,-12.5 12.5,0 0,12.5 -12.5,0" fill="#07101e" />
      <polygon points="0,-10 10,0 0,10 -10,0" fill="#0ea5e9" />
      <polygon points="0,-10 10,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 10,0 0,10" fill="#0284c7" />
      <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" fill="#e0f2fe" />
    </g>

    <!-- Medaglione Circolare Base con 4 Gemme -->
    <g id="roundSysBtn7">
      <circle cx="0" cy="0" r="74" fill="url(#bronzeRing7)" stroke="#1c0f07" stroke-width="2.2" />
      <path d="M -58,-36 A 68,68 0 0,1 58,-36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <circle cx="0" cy="0" r="60" fill="#070b12" stroke="#1c0f07" stroke-width="1.8" />
      <circle cx="0" cy="0" r="56" fill="url(#slateDisc7)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.65" />
      <line x1="-30" y1="-50" x2="20" y2="50" stroke="#ffffff" stroke-width="1.2" opacity="0.05" />
      <use href="#gemSys7" x="0" y="-70" />
      <use href="#gemSys7" x="70" y="0" />
      <use href="#gemSys7" x="0" y="70" />
      <use href="#gemSys7" x="-70" y="0" />
    </g>
  </defs>

  <g filter="url(#shadowSys)">
    <!-- 1. SALVA (Floppy Disk) -->
    <g transform="translate(95, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)">
        <path fill-rule="evenodd" d="M -26,-28 L 16,-28 L 28,-16 L 28,26 C 28,28 26,30 24,30 L -24,30 C -26,30 -28,28 -28,26 L -28,-26 C -28,-28 -26,-28 -26,-28 Z 
                 M -14,-26 L 12,-26 L 12,-10 L -14,-10 Z 
                 M -18,6 L 18,6 L 18,24 L -18,24 Z" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="2" stroke-linejoin="round" />
        <rect x="2" y="-24" width="6" height="11" fill="url(#ivorySys7)" />
      </g>
    </g>

    <!-- 2. CARTELLA (Folder) -->
    <g transform="translate(275, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)" stroke="#1c110a" stroke-width="2" stroke-linejoin="round">
        <!-- Retro cartella -->
        <path d="M -30,-24 L -8,-24 L -2,-16 L 24,-16 L 24,22 L -30,22 Z" fill="#b8a38e" />
        <!-- Fronte cartella inclinato -->
        <polygon points="-30,22 -20,-6 32,-6 24,22" fill="url(#ivorySys7)" />
      </g>
    </g>

    <!-- 3. AGGIORNA / RICOMINCIA (Freccia Circolare) -->
    <g transform="translate(455, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)">
        <path d="M 26,8 A 26,26 0 1,1 18,-18" fill="none" stroke="#1c110a" stroke-width="11" stroke-linecap="round" />
        <path d="M 26,8 A 26,26 0 1,1 18,-18" fill="none" stroke="url(#ivorySys7)" stroke-width="7" stroke-linecap="round" />
        <polygon points="26,-28 26,-6 4,-6" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="2" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 4. PAUSA (||) -->
    <g transform="translate(635, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="2">
        <rect x="-20" y="-26" width="13" height="52" rx="3" />
        <rect x="7" y="-26" width="13" height="52" rx="3" />
      </g>
    </g>

    <!-- 5. PLAY (▶) -->
    <g transform="translate(815, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)">
        <polygon points="-18,-28 26,0 -18,28" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="2.2" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 6. AUDIO ATTIVO (Altoparlante + Onde) -->
    <g transform="translate(995, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)">
        <polygon points="-28,-10 -14,-10 4,-26 4,26 -14,10 -28,10" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="2" stroke-linejoin="round" />
        <path d="M 12,-14 A 18,18 0 0,1 12,14" fill="none" stroke="url(#ivorySys7)" stroke-width="5" stroke-linecap="round" />
        <path d="M 21,-24 A 30,30 0 0,1 21,24" fill="none" stroke="url(#ivorySys7)" stroke-width="5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 7. AUDIO MUTO (Altoparlante Barrato) -->
    <g transform="translate(1175, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)">
        <polygon points="-22,-10 -8,-10 10,-26 10,26 -8,10 -22,10" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="2" stroke-linejoin="round" />
        <line x1="-18" y1="-28" x2="24" y2="28" stroke="#1c110a" stroke-width="8" stroke-linecap="round" />
        <line x1="-18" y1="-28" x2="24" y2="28" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 8. MUSICA (Nota Doppia ♫) -->
    <g transform="translate(1355, 105)">
      <use href="#roundSysBtn7" />
      <g filter="url(#sysIconDrop7)" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="1.8" stroke-linejoin="round">
        <path d="M -12,20 L -12,-22 L 24,-30 L 24,12 L 17,12 L 17,-18 L -5,-13 L -5,20 Z" />
        <ellipse cx="-18" cy="20" rx="10" ry="7" transform="rotate(-15 -18 20)" />
        <ellipse cx="14" cy="13" rx="10" ry="7" transform="rotate(-15 14 13)" />
      </g>
    </g>

    <!-- 9. SCHERMO INTERO (Cornice Quadrata Smussata + 4 Angoli) -->
    <g transform="translate(1540, 105)">
      <!-- Cornice Esterna Squircle in Bronzo -->
      <rect x="-76" y="-76" width="152" height="152" rx="46" fill="url(#bronzeRing7)" stroke="#1c0f07" stroke-width="2.2" />
      <path d="M -56,-68 L 56,-68" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
      <!-- Interno Squircle Blu Ardesia -->
      <rect x="-62" y="-62" width="124" height="124" rx="36" fill="url(#slateDisc7)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7" />
      <!-- 4 Angoli Schermo Intero in Avorio 3D -->
      <g filter="url(#sysIconDrop7)" fill="url(#ivorySys7)" stroke="#1c110a" stroke-width="1.5" stroke-linejoin="round">
        <!-- Top-Left -->
        <path d="M -28,-10 L -28,-28 L -10,-28 L -10,-19 L -19,-19 L -19,-10 Z" />
        <!-- Top-Right -->
        <path d="M 28,-10 L 28,-28 L 10,-28 L 10,-19 L 19,-19 L 19,-10 Z" />
        <!-- Bottom-Left -->
        <path d="M -28,10 L -28,28 L -10,28 L -10,19 L -19,19 L -19,10 Z" />
        <!-- Bottom-Right -->
        <path d="M 28,10 L 28,28 L 10,28 L 10,19 L 19,19 L 19,10 Z" />
      </g>
      <!-- 4 Gemme Cardinali -->
      <use href="#gemSys7" x="0" y="-74" />
      <use href="#gemSys7" x="74" y="0" />
      <use href="#gemSys7" x="0" y="74" />
      <use href="#gemSys7" x="-74" y="0" />
    </g>
  </g>
</svg>