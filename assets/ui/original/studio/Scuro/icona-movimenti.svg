<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="shadowMov" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeRing4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Disco Interno Turchese-Ardesia Profondo -->
    <radialGradient id="tealSlateDisc4" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="62%" stop-color="#114252" />
      <stop offset="100%" stop-color="#06202b" />
    </radialGradient>

    <!-- Gradiente Impronte Avorio 3D -->
    <linearGradient id="ivoryPrint4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5ebe0" />
      <stop offset="100%" stop-color="#cbb8a3" />
    </linearGradient>

    <!-- Gemma Cardinale a Diamante -->
    <g id="cardinalGem4">
      <polygon points="0,-29 29,0 0,29 -29,0" fill="url(#bronzeRing4)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-24 24,0 0,24 -24,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-19 19,0 0,19 -19,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#0ea5e9" />
      <polygon points="0,-16 16,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 16,0 0,16" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>

    <!-- Componente Singola Impronta (Pianta + Tacco) -->
    <g id="singleFootprint4">
      <!-- Pianta anteriore -->
      <path d="M -15,-12 C -17,-30 -10,-40 0,-40 C 10,-40 17,-30 15,-12 C 14,2 11,12 10,16 L -10,16 C -11,12 -14,2 -15,-12 Z" />
      <!-- Tacco posteriore -->
      <path d="M -9,22 L 9,22 L 8,33 C 7,39 -7,39 -8,33 Z" />
    </g>
  </defs>

  <g filter="url(#shadowMov)" transform="translate(140, 140)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="106" fill="url(#bronzeRing4)" stroke="#1c0f07" stroke-width="2.5" />
    <path d="M -86,-52 A 99,99 0 0,1 86,-52" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- 2. TRINCEA SCURA E DISCO INTERNO TURCHESE-ARDESIA -->
    <circle cx="0" cy="0" r="84" fill="#04121a" stroke="#1c0f07" stroke-width="2" />
    <circle cx="0" cy="0" r="78" fill="url(#tealSlateDisc4)" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" />

    <!-- Archi Luminosi Interni -->
    <path d="M -58,-38 A 69,69 0 0,1 58,-38" fill="none" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M -52,44 A 68,68 0 0,0 52,44" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- 3. DOPPIA IMPRONTA DI PASSI 3D IN AVORIO -->
    <g>
      <!-- Impronta Sinistra (Più bassa) -->
      <g transform="translate(-24, 18) rotate(-10)">
        <use href="#singleFootprint4" x="0" y="5" fill="#031017" opacity="0.75" />
        <use href="#singleFootprint4" fill="url(#ivoryPrint4)" stroke="#1c110a" stroke-width="2.5" stroke-linejoin="round" />
      </g>
      <!-- Impronta Destra (Più alta) -->
      <g transform="translate(24, -14) rotate(10)">
        <use href="#singleFootprint4" x="0" y="5" fill="#031017" opacity="0.75" />
        <use href="#singleFootprint4" fill="url(#ivoryPrint4)" stroke="#1c110a" stroke-width="2.5" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 4. QUATTRO GEMME SUI PUNTI CARDINALI -->
    <use href="#cardinalGem4" x="0" y="-98" />
    <use href="#cardinalGem4" x="98" y="0" />
    <use href="#cardinalGem4" x="0" y="98" />
    <use href="#cardinalGem4" x="-98" y="0" />
  </g>
</svg>