<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 220" width="100%" height="100%">
  <defs>
    <filter id="shadowConn" x="-3%" y="-10%" width="106%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="iconShadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#05080f" flood-opacity="0.85" />
    </filter>

    <!-- Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeMain6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="52%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#5e3a22" />
    </linearGradient>

    <radialGradient id="slateBoard6" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#22354f" />
      <stop offset="65%" stop-color="#121c2b" />
      <stop offset="100%" stop-color="#090e17" />
    </radialGradient>

    <!-- Metallo Argento/Avorio per le Catene -->
    <linearGradient id="silverChain6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Oro/Bronzo Brillante per Lucchetto, Clessidra e Catena Spezzata -->
    <linearGradient id="goldAmber6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Rosso Corallo per Scintille e X -->
    <linearGradient id="coralRed6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Ciano per Freccia Ricarica -->
    <linearGradient id="cyanArrow6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gemma Cardinale Piccola -->
    <g id="gemCard6">
      <polygon points="0,-21 21,0 0,21 -21,0" fill="url(#bronzeMain6)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round" />
      <polygon points="0,-17 17,0 0,17 -17,0" fill="none" stroke="#fff3e6" stroke-width="0.8" opacity="0.75" />
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#07101e" />
      <polygon points="0,-10.5 10.5,0 0,10.5 -10.5,0" fill="#0ea5e9" />
      <polygon points="0,-10.5 10.5,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 10.5,0 0,10.5" fill="#0284c7" />
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#e0f2fe" />
    </g>

    <!-- Base Pulsante Ottagonale con 4 Gemme Cardinali -->
    <g id="octaBtn4Gems6">
      <polygon points="-46,-76 46,-76 76,-46 76,46 46,76 -46,76 -76,46 -76,-46" fill="url(#bronzeMain6)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polyline points="-44,-72 44,-72 72,-44" fill="none" stroke="#fff3e6" stroke-width="1.5" opacity="0.8" />
      <polygon points="-41,-65 41,-65 65,-41 65,41 41,65 -41,65 -65,41 -65,-41" fill="url(#slateBoard6)" stroke="#140c07" stroke-width="2" stroke-linejoin="round" />
      <polygon points="-38,-60 38,-60 60,-38 60,38 38,60 -38,60 -60,38 -60,-38" fill="none" stroke="#4b657d" stroke-width="1.5" opacity="0.8" stroke-linejoin="round" />
      <line x1="-35" y1="-60" x2="25" y2="60" stroke="#ffffff" stroke-width="1.2" opacity="0.05" />
      <!-- 4 Gemme (N, E, S, W) -->
      <use href="#gemCard6" x="0" y="-76" />
      <use href="#gemCard6" x="76" y="0" />
      <use href="#gemCard6" x="0" y="76" />
      <use href="#gemCard6" x="-76" y="0" />
    </g>

    <!-- Icona Catena Intera Riutilizzabile -->
    <g id="chainLinkIcon6" transform="rotate(-45)">
      <!-- Anello Sinistro -->
      <rect x="-38" y="-14" width="44" height="28" rx="14" fill="none" stroke="#090e17" stroke-width="13" />
      <rect x="-38" y="-14" width="44" height="28" rx="14" fill="none" stroke="url(#silverChain6)" stroke-width="9" />
      <!-- Anello Destro Intrecciato -->
      <rect x="-6" y="-14" width="44" height="28" rx="14" fill="none" stroke="#090e17" stroke-width="13" />
      <rect x="-6" y="-14" width="44" height="28" rx="14" fill="none" stroke="url(#silverChain6)" stroke-width="9" />
      <!-- Sovrapposizione centrale per vero intreccio -->
      <path d="M -8,-14 L 0,-14 A 14,14 0 0,1 6,0" fill="none" stroke="#090e17" stroke-width="13" />
      <path d="M -10,-14 L 0,-14 A 14,14 0 0,1 6,0" fill="none" stroke="url(#silverChain6)" stroke-width="9" />
    </g>
  </defs>

  <g filter="url(#shadowConn)">
    <!-- 1. CONNESSO (Catena + Spunta Verde/Turchese) -->
    <g transform="translate(105, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <use href="#chainLinkIcon6" transform="translate(-4, -4) scale(0.95)" />
        <circle cx="22" cy="22" r="18" fill="#10b981" stroke="#064e3b" stroke-width="2" />
        <polyline points="13,22 20,29 31,15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 2. IN CONNESSIONE (Catena + 3 Puntini) -->
    <g transform="translate(305, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <use href="#chainLinkIcon6" transform="translate(0, -8) scale(0.9)" />
        <circle cx="-22" cy="34" r="6.5" fill="url(#silverChain6)" stroke="#090e17" stroke-width="1.5" />
        <circle cx="0" cy="34" r="6.5" fill="url(#silverChain6)" stroke="#090e17" stroke-width="1.5" />
        <circle cx="22" cy="34" r="6.5" fill="url(#silverChain6)" stroke="#090e17" stroke-width="1.5" />
      </g>
    </g>

    <!-- 3. DISCONNESSO (Catena Spezzata in Oro/Bronzo + Scintille) -->
    <g transform="translate(505, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <g transform="rotate(-45)">
          <path d="M -12,-14 L -32,-14 A 14,14 0 0,0 -32,14 L -12,14" fill="none" stroke="#1c110a" stroke-width="13" stroke-linecap="round" />
          <path d="M -12,-14 L -32,-14 A 14,14 0 0,0 -32,14 L -12,14" fill="none" stroke="url(#goldAmber6)" stroke-width="9" stroke-linecap="round" />
          <path d="M 12,-14 L 32,-14 A 14,14 0 0,1 32,14 L 12,14" fill="none" stroke="#1c110a" stroke-width="13" stroke-linecap="round" />
          <path d="M 12,-14 L 32,-14 A 14,14 0 0,1 32,14 L 12,14" fill="none" stroke="url(#goldAmber6)" stroke-width="9" stroke-linecap="round" />
        </g>
        <!-- Scintille Rosse di Disconnessione -->
        <line x1="-12" y1="-16" x2="-24" y2="-28" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
        <line x1="-2" y1="-20" x2="-4" y2="-36" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
        <line x1="-18" y1="-6" x2="-34" y2="-10" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
        <line x1="12" y1="14" x2="22" y2="24" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- 4. BLOCCATO (Lucchetto 3D in Oro/Bronzo) -->
    <g transform="translate(705, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <!-- Arco del lucchetto -->
        <path d="M -16,-6 L -16,-24 C -16,-38 16,-38 16,-24 L 16,-6" fill="none" stroke="#1c110a" stroke-width="13" />
        <path d="M -16,-6 L -16,-24 C -16,-38 16,-38 16,-24 L 16,-6" fill="none" stroke="url(#goldAmber6)" stroke-width="9" />
        <!-- Corpo del lucchetto -->
        <rect x="-30" y="-8" width="60" height="46" rx="8" fill="url(#goldAmber6)" stroke="#1c110a" stroke-width="2.5" />
        <line x1="-24" y1="-3" x2="24" y2="-3" stroke="#fef9c3" stroke-width="2" stroke-linecap="round" />
        <!-- Toppa della chiave -->
        <circle cx="0" cy="11" r="6.5" fill="#1c110a" />
        <polygon points="-4,14 4,14 6,26 -6,26" fill="#1c110a" />
      </g>
    </g>

    <!-- 5. IN ATTESA (Clessidra 3D) -->
    <g transform="translate(905, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <!-- Vetro Clessidra -->
        <path d="M -22,-30 C -22,-8 -4,-4 -4,0 C -4,4 -22,8 -22,30 L 22,30 C 22,8 4,4 4,0 C 4,-4 22,-8 22,-30 Z" fill="#475569" fill-opacity="0.55" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />
        <!-- Sabbia Dorata Superiore e Inferiore -->
        <path d="M -15,-18 C -12,-8 -3,-4 0,-2 C 3,-4 12,-8 15,-18 Z" fill="url(#goldAmber6)" />
        <path d="M -18,28 C -15,16 -4,10 0,4 C 4,10 15,16 18,28 Z" fill="url(#goldAmber6)" />
        <!-- Basi in Bronzo/Oro Superiore e Inferiore -->
        <rect x="-28" y="-36" width="56" height="8" rx="4" fill="url(#goldAmber6)" stroke="#1c110a" stroke-width="2" />
        <rect x="-28" y="28" width="56" height="8" rx="4" fill="url(#goldAmber6)" stroke="#1c110a" stroke-width="2" />
      </g>
    </g>

    <!-- 6. LINK STANDARD (Catena Intera) -->
    <g transform="translate(1105, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <use href="#chainLinkIcon6" />
      </g>
    </g>

    <!-- 7. RICARICA / RICONNETTI (Freccia Circolare Ciano) -->
    <g transform="translate(1305, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <path d="M 32,8 A 32,32 0 1,1 22,-22" fill="none" stroke="#07101e" stroke-width="14" stroke-linecap="round" />
        <path d="M 32,8 A 32,32 0 1,1 22,-22" fill="none" stroke="url(#cyanArrow6)" stroke-width="10" stroke-linecap="round" />
        <polygon points="32,-34 32,-8 6,-8" fill="url(#cyanArrow6)" stroke="#07101e" stroke-width="2" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 8. ERRORE / ANNULLA (Icona X Rossa 3D) -->
    <g transform="translate(1505, 110)">
      <use href="#octaBtn4Gems6" />
      <g filter="url(#iconShadow6)">
        <polygon points="0,-10 22,-32 32,-22 10,0 32,22 22,32 0,10 -22,32 -32,22 -10,0 -32,-22 -22,-32" fill="url(#coralRed6)" stroke="#240808" stroke-width="2.2" stroke-linejoin="round" />
        <polyline points="-30,-22 -22,-30 0,-8 22,-30 30,-22" fill="none" stroke="#fecaca" stroke-width="1.8" stroke-linecap="round" />
      </g>
    </g>
  </g>
</svg>