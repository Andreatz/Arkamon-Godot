<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" width="100%" height="100%">
  <defs>
    <filter id="shadowInv" x="-5%" y="-6%" width="110%" height="115%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <linearGradient id="bronzeMain4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="52%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#5e3a22" />
    </linearGradient>

    <linearGradient id="trenchDark4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c110a" />
      <stop offset="50%" stop-color="#2e1d13" />
      <stop offset="100%" stop-color="#140c07" />
    </linearGradient>

    <linearGradient id="slateBoard4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101824" />
      <stop offset="50%" stop-color="#1f2d40" />
      <stop offset="100%" stop-color="#101722" />
    </linearGradient>

    <linearGradient id="steelBevel4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#607d96" />
      <stop offset="50%" stop-color="#364b61" />
      <stop offset="100%" stop-color="#4b657d" />
    </linearGradient>

    <linearGradient id="lightPlate4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <radialGradient id="bronzeStud4" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="30%" stop-color="#eab68c" />
      <stop offset="75%" stop-color="#8c5c3e" />
      <stop offset="100%" stop-color="#3b2112" />
    </radialGradient>

    <!-- Foro Rettangolare Smussato per Singolo Slot -->
    <rect id="holeShape4" x="-48" y="-42" width="96" height="84" rx="12" />

    <!-- Maschera Globale per Forare i 12 Slot dell'Inventario (100% Trasparenti) -->
    <mask id="twelveSlotsMask4">
      <rect x="0" y="0" width="1060" height="650" fill="#ffffff" />
      <!-- Riga 1 (y = 195) -->
      <use href="#holeShape4" x="232" y="195" fill="#000000" />
      <use href="#holeShape4" x="430" y="195" fill="#000000" />
      <use href="#holeShape4" x="630" y="195" fill="#000000" />
      <use href="#holeShape4" x="828" y="195" fill="#000000" />
      <!-- Riga 2 (y = 355) -->
      <use href="#holeShape4" x="232" y="355" fill="#000000" />
      <use href="#holeShape4" x="430" y="355" fill="#000000" />
      <use href="#holeShape4" x="630" y="355" fill="#000000" />
      <use href="#holeShape4" x="828" y="355" fill="#000000" />
      <!-- Riga 3 (y = 515) -->
      <use href="#holeShape4" x="232" y="515" fill="#000000" />
      <use href="#holeShape4" x="430" y="515" fill="#000000" />
      <use href="#holeShape4" x="630" y="515" fill="#000000" />
      <use href="#holeShape4" x="828" y="515" fill="#000000" />
    </mask>

    <!-- Gemma Media Cornice Esterna -->
    <g id="gemMed4">
      <polygon points="0,-24 24,0 0,24 -24,0" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="1.7" stroke-linejoin="round" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#07101e" />
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#0ea5e9" />
      <polygon points="0,-13 13,0 0,0" fill="#7dd3fc" />
      <polygon points="0,-6 6,0 0,6 -6,0" fill="#e0f2fe" />
    </g>

    <!-- Gemma Piccola per gli Slot -->
    <g id="gemTiny4">
      <polygon points="0,-15 14,0 0,15 -14,0" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="1.4" stroke-linejoin="round" />
      <polygon points="0,-10 9,0 0,10 -9,0" fill="#07101e" />
      <polygon points="0,-8 7,0 0,8 -7,0" fill="#0ea5e9" />
      <polygon points="0,-4 3.5,0 0,4 -3.5,0" fill="#e0f2fe" />
    </g>

    <!-- Componente Cornice Singolo Slot Inventario -->
    <g id="invSlotFrame4">
      <!-- Ombra esterna slot -->
      <polygon points="-56,-70 56,-70 78,-48 78,48 56,70 -56,70 -78,48 -78,-48" transform="translate(0, 5)" fill="#060a0f" opacity="0.6" />
      <!-- Cornice Ottagonale Bronzo -->
      <polygon points="-56,-70 56,-70 78,-48 78,48 56,70 -56,70 -78,48 -78,-48" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <!-- Fascia Interna Blu Ardesia Notte -->
      <polygon points="-51,-62 51,-62 70,-43 70,43 51,62 -51,62 -70,43 -70,-43" fill="#0a121e" stroke="#607d96" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Bordo Interno Attorno al Foro Trasparente -->
      <rect x="-50" y="-44" width="100" height="88" rx="13" fill="none" stroke="#24130a" stroke-width="3" />
      <rect x="-52" y="-46" width="104" height="92" rx="14" fill="none" stroke="#4b657d" stroke-width="1.2" />
    </g>

    <!-- Gemme Laterali Singolo Slot (Fuori dalla maschera per non essere tagliate) -->
    <g id="invSlotGems4">
      <use href="#gemTiny4" x="-75" y="0" />
      <use href="#gemTiny4" x="75" y="0" />
    </g>
  </defs>

  <g filter="url(#shadowInv)">
    <!-- 1. CORPO FINESTRA E 12 SLOT FORATI CON MASCHERA -->
    <g mask="url(#twelveSlotsMask4)">
      <!-- Cornice Principale in Bronzo -->
      <polygon points="78,20 982,20 1028,66 1028,584 984,628 76,628 32,584 32,66" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Trincea Scura -->
      <polygon points="84,30 976,30 1016,70 1016,578 978,616 82,616 44,578 44,70" fill="url(#trenchDark4)" stroke="#140c07" stroke-width="1.5" />
      <!-- Lastra Principale Blu Ardesia -->
      <polygon points="90,38 970,38 1008,76 1008,572 972,608 88,608 52,572 52,76" fill="url(#slateBoard4)" stroke="#f5d5b8" stroke-width="2" stroke-linejoin="round" />

      <!-- Filetto Interno e Onde Laterali -->
      <polygon points="98,48 962,48 996,82 996,564 964,596 96,596 64,564 64,82" fill="none" stroke="url(#steelBevel4)" stroke-width="2" opacity="0.8" />
      <path d="M 64,175 C 95,280 75,380 120,490 C 130,520 135,560 140,596" fill="none" stroke="#4b657d" stroke-width="2" opacity="0.45" />
      <path d="M 996,175 C 965,280 985,380 940,490 C 930,520 925,560 920,596" fill="none" stroke="#4b657d" stroke-width="2" opacity="0.45" />

      <!-- Cornici dei 12 Slot Inventario (4 colonne x 3 righe) -->
      <!-- Riga 1 -->
      <use href="#invSlotFrame4" x="232" y="195" />
      <use href="#invSlotFrame4" x="430" y="195" />
      <use href="#invSlotFrame4" x="630" y="195" />
      <use href="#invSlotFrame4" x="828" y="195" />
      <!-- Riga 2 -->
      <use href="#invSlotFrame4" x="232" y="355" />
      <use href="#invSlotFrame4" x="430" y="355" />
      <use href="#invSlotFrame4" x="630" y="355" />
      <use href="#invSlotFrame4" x="828" y="355" />
      <!-- Riga 3 -->
      <use href="#invSlotFrame4" x="232" y="515" />
      <use href="#invSlotFrame4" x="430" y="515" />
      <use href="#invSlotFrame4" x="630" y="515" />
      <use href="#invSlotFrame4" x="828" y="515" />
    </g>

    <!-- 2. GEMME DEI 12 SLOT INVENTARIO -->
    <!-- Riga 1 -->
    <use href="#invSlotGems4" x="232" y="195" />
    <use href="#invSlotGems4" x="430" y="195" />
    <use href="#invSlotGems4" x="630" y="195" />
    <use href="#invSlotGems4" x="828" y="195" />
    <!-- Riga 2 -->
    <use href="#invSlotGems4" x="232" y="355" />
    <use href="#invSlotGems4" x="430" y="355" />
    <use href="#invSlotGems4" x="630" y="355" />
    <use href="#invSlotGems4" x="828" y="355" />
    <!-- Riga 3 -->
    <use href="#invSlotGems4" x="232" y="515" />
    <use href="#invSlotGems4" x="430" y="515" />
    <use href="#invSlotGems4" x="630" y="515" />
    <use href="#invSlotGems4" x="828" y="515" />

    <!-- 3. PULSANTI DI PAGINAZIONE (< SINISTRA E > DESTRA) IN ALTO -->
    <!-- Pulsante Freccia Sinistra -->
    <g transform="translate(116, 84)">
      <polygon points="-32,-44 32,-44 48,-28 48,28 32,44 -32,44 -48,28 -48,-28" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="-28,-36 28,-36 40,-24 40,24 28,36 -28,36 -40,24 -40,-24" fill="url(#slateBoard4)" stroke="#607d96" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="-16,0 14,-22 14,22" fill="url(#lightPlate4)" stroke="#090f18" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Pulsante Freccia Destra -->
    <g transform="translate(944, 84)">
      <polygon points="-32,-44 32,-44 48,-28 48,28 32,44 -32,44 -48,28 -48,-28" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="-28,-36 28,-36 40,-24 40,24 28,36 -28,36 -40,24 -40,-24" fill="url(#slateBoard4)" stroke="#607d96" stroke-width="1.5" stroke-linejoin="round" />
      <polygon points="16,0 -14,-22 -14,22" fill="url(#lightPlate4)" stroke="#090f18" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- 4. TARGA SUPERIORE (HEADER) -->
    <g>
      <polygon points="310,16 750,16 782,48 746,90 314,90 278,48" fill="#060a0f" opacity="0.65" />
      <polygon points="316,8 744,8 778,44 744,80 316,80 282,44" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="322,16 738,16 766,44 738,72 322,72 294,44" fill="url(#lightPlate4)" stroke="#4b657d" stroke-width="1.5" stroke-linejoin="round" />

      <circle cx="318" cy="44" r="8" fill="url(#bronzeStud4)" stroke="#24130a" stroke-width="1.5" />
      <circle cx="742" cy="44" r="8" fill="url(#bronzeStud4)" stroke="#24130a" stroke-width="1.5" />

      <g transform="translate(530, 44)">
        <polygon points="0,-38 30,0 0,38 -30,0" fill="url(#bronzeMain4)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
        <polygon points="0,-28 21,0 0,28 -21,0" fill="#07101e" />
        <polygon points="0,-24 18,0 0,24 -18,0" fill="#0ea5e9" />
        <polygon points="0,-24 18,0 0,0" fill="#7dd3fc" />
        <polygon points="0,0 18,0 0,24" fill="#0284c7" />
        <polygon points="0,-11 8,0 0,11 -8,0" fill="#e0f2fe" />
      </g>
    </g>

    <!-- 5. GEMME LATERALI E RIVETTI INFERIORI CORNICE -->
    <use href="#gemMed4" x="42" y="165" />
    <use href="#gemMed4" x="42" y="455" />
    <use href="#gemMed4" x="1018" y="165" />
    <use href="#gemMed4" x="1018" y="455" />

    <circle cx="80" cy="590" r="8.5" fill="url(#bronzeStud4)" stroke="#24130a" stroke-width="1.5" />
    <circle cx="980" cy="590" r="8.5" fill="url(#bronzeStud4)" stroke="#24130a" stroke-width="1.5" />
  </g>
</svg>