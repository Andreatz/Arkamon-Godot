<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="shadowGemma" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Castone Principale in Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeMain9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="25%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#6e4429" />
      <stop offset="100%" stop-color="#3b2112" />
    </linearGradient>

    <!-- Sfaccettature Cristallo Ciano Centrale -->
    <linearGradient id="crystalTopLeft9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="crystalTopRight9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="crystalBottomLeft9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="crystalBottomRight9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Gemma Laterale Minore -->
    <g id="flankGem9">
      <polygon points="0,-29 29,0 0,29 -29,0" fill="url(#bronzeMain9)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-29 -29,0 -18,0 0,-18" fill="#fff7ed" opacity="0.65" />
      <polygon points="0,29 29,0 18,0 0,18" fill="#3b2112" opacity="0.65" />
      <polygon points="0,-24 24,0 0,24 -24,0" fill="none" stroke="#fff3e6" stroke-width="0.9" opacity="0.75" />
      <polygon points="0,-18 18,0 0,18 -18,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-15 15,0 0,15 -15,0" fill="#0ea5e9" />
      <polygon points="0,-15 15,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 15,0 0,15" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowGemma)" transform="translate(140, 140)">
    <!-- 1. GRANDE CASTONE A LOSANGA IN BRONZO SCOLPITO -->
    <polygon points="0,-118 82,0 0,118 -82,0" fill="url(#bronzeMain9)" stroke="#24130a" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Piani Sfaccettati 3D del Castone in Bronzo -->
    <polygon points="0,-118 -82,0 -58,0 0,-84" fill="#fff7ed" opacity="0.6" />
    <polygon points="0,-118 82,0 58,0 0,-84" fill="#e5bfa0" opacity="0.4" />
    <polygon points="0,118 -82,0 -58,0 0,84" fill="#784d31" opacity="0.5" />
    <polygon points="0,118 82,0 58,0 0,84" fill="#3b2112" opacity="0.7" />
    <polygon points="0,-88 61,0 0,88 -61,0" fill="none" stroke="#fff3e6" stroke-width="1.5" opacity="0.8" />

    <!-- 2. TRINCEA SCURA E GRANDE CRISTALLO AZZURRO-CIANO -->
    <polygon points="0,-84 58,0 0,84 -58,0" fill="#07101e" stroke="#140c07" stroke-width="2" stroke-linejoin="round" />

    <!-- 4 Quadranti del Cristallo -->
    <polygon points="0,-78 -54,0 0,0" fill="url(#crystalTopLeft9)" />
    <polygon points="0,-78 54,0 0,0" fill="url(#crystalTopRight9)" />
    <polygon points="0,78 -54,0 0,0" fill="url(#crystalBottomLeft9)" />
    <polygon points="0,78 54,0 0,0" fill="url(#crystalBottomRight9)" />

    <!-- Bordo Interno Sfaccettato del Cristallo -->
    <polygon points="0,-64 44,0 0,64 -44,0" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.65" />

    <!-- Stella di Luce Centrale a 4 Punte -->
    <polygon points="0,-74 4,-4 50,0 4,4 0,74 -4,4 -50,0 -4,-4" fill="#e0f2fe" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />

    <!-- 3. DUE GEMME ROMBOIDALI SUI VERTICI LATERALI -->
    <use href="#flankGem9" x="-82" y="0" />
    <use href="#flankGem9" x="82" y="0" />
  </g>
</svg>