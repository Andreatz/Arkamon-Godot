<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190" width="100%" height="100%">
  <defs>
    <filter id="shadowSlider" x="-4%" y="-12%" width="108%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="thumbShadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Cornice in Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeMain9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="52%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#5e3a22" />
    </linearGradient>

    <linearGradient id="trenchDark9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c110a" />
      <stop offset="50%" stop-color="#2e1d13" />
      <stop offset="100%" stop-color="#140c07" />
    </linearGradient>

    <!-- Lastra Interna Blu Ardesia Scuro -->
    <linearGradient id="slateBoard9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101824" />
      <stop offset="50%" stop-color="#1f2d40" />
      <stop offset="100%" stop-color="#101722" />
    </linearGradient>

    <!-- Barra di Progresso Attiva Turchese-Ciano 3D -->
    <linearGradient id="activeTrackCyan9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="25%" stop-color="#2dd4bf" />
      <stop offset="75%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Traccia Spenta Incassata (Destra) -->
    <linearGradient id="inactiveTrack9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050911" />
      <stop offset="50%" stop-color="#0c1524" />
      <stop offset="100%" stop-color="#142238" />
    </linearGradient>

    <!-- Gemma Terminale Piccola -->
    <g id="endGem9">
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#bronzeMain9)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-23 23,0 0,23 -23,0" fill="none" stroke="#fff3e6" stroke-width="0.9" opacity="0.75" />
      <polygon points="0,-18 18,0 0,18 -18,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-15 15,0 0,15 -15,0" fill="#0ea5e9" />
      <polygon points="0,-15 15,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 15,0 0,15" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowSlider)">
    <!-- 1. CORNICE ALLUNGATA ESTERNA IN BRONZO -->
    <polygon points="74,40 846,40 894,88 894,102 846,150 74,150 26,102 26,88" fill="url(#bronzeMain9)" stroke="#24130a" stroke-width="2.2" stroke-linejoin="round" />
    <polyline points="76,44 844,44 890,90" fill="none" stroke="#fff3e6" stroke-width="1.6" opacity="0.85" />

    <!-- 2. TRINCEA SCURA E LASTRA BLU ARDESIA -->
    <polygon points="79,50 841,50 882,91 882,99 841,140 79,140 38,99 38,91" fill="url(#trenchDark9)" stroke="#140c07" stroke-width="1.5" stroke-linejoin="round" />

    <polygon points="84,56 836,56 874,94 874,96 836,134 84,134 46,96 46,94" fill="url(#slateBoard9)" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7" stroke-linejoin="round" />

    <!-- Linee Diagonali di Riflesso sulla Lastra (Stile percorso.svg) -->
    <g stroke="#ffffff" stroke-width="1.2" opacity="0.06">
      <line x1="150" y1="56" x2="195" y2="134" />
      <line x1="180" y1="56" x2="225" y2="134" />
      <line x1="770" y1="56" x2="725" y2="134" />
      <line x1="740" y1="56" x2="695" y2="134" />
    </g>

    <!-- 3. CANALE INTERNO DELLO SLIDER (TRACCIA) -->
    <!-- Fondo Traccia Spenta Incassata -->
    <rect x="108" y="75" width="704" height="40" rx="20" fill="url(#inactiveTrack9)" stroke="#0284c7" stroke-width="2" stroke-opacity="0.8" />

    <!-- Riempimento Sinistro Attivo in Turchese-Ciano 3D -->
    <path d="M 128,77 L 460,77 L 460,113 L 128,113 A 18,18 0 0,1 128,77 Z" fill="url(#activeTrackCyan9)" />
    <!-- Riflesso Lucido Superiore sulla Barra Attiva -->
    <rect x="122" y="81" width="330" height="8" rx="4" fill="#ffffff" opacity="0.65" />

    <!-- 4. GEMME ROMBOIDALI ALLE ESTREMITÀ SINISTRA E DESTRA -->
    <use href="#endGem9" x="44" y="95" />
    <use href="#endGem9" x="876" y="95" />

    <!-- 5. GRANDE CURSORE CENTRALE A LOSANGA (THUMB) -->
    <g transform="translate(460, 95)" filter="url(#thumbShadow9)">
      <!-- Castone a Losanga in Bronzo Scolpito (Stile percorso.svg) -->
      <polygon points="0,-74 54,0 0,74 -54,0" fill="url(#bronzeMain9)" stroke="#24130a" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Piani 3D del castone -->
      <polygon points="0,-74 -54,0 -36,0 0,-50" fill="#fff7ed" opacity="0.65" />
      <polygon points="0,74 54,0 36,0 0,50" fill="#3b2112" opacity="0.7" />
      <polygon points="0,-54 39,0 0,54 -39,0" fill="none" stroke="#fff3e6" stroke-width="1.2" opacity="0.8" />

      <!-- Trincea e Cristallo Azzurro-Ciano Sfaccettato -->
      <polygon points="0,-50 36,0 0,50 -36,0" fill="#07101e" stroke="#140c07" stroke-width="1.8" stroke-linejoin="round" />
      <!-- 4 Facce del Cristallo -->
      <polygon points="0,-46 -33,0 0,0" fill="#7dd3fc" />
      <polygon points="0,-46 33,0 0,0" fill="#38bdf8" />
      <polygon points="0,46 -33,0 0,0" fill="#0284c7" />
      <polygon points="0,46 33,0 0,0" fill="#0369a1" />
      <!-- Rombo Luminoso Centrale -->
      <polygon points="0,-38 10,0 0,14 -10,0" fill="#e0f2fe" />
      <polygon points="0,-38 0,14 -10,0" fill="#ffffff" opacity="0.9" />
    </g>
  </g>
</svg>