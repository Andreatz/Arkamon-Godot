<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" width="100%" height="100%">
  <defs>
    <filter id="shadowMosse" x="-4%" y="-10%" width="108%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="iconDrop6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Anello in Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeRing6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- 1. Sfera e Foglia (Erba) -->
    <radialGradient id="orbGreen6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="65%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <linearGradient id="leafFill6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- 2. Sfera e Fiamma (Fuoco) -->
    <radialGradient id="orbRed6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="65%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <linearGradient id="flameFill6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 3. Sfera e Goccia (Acqua) -->
    <radialGradient id="orbBlue6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="65%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
    <linearGradient id="dropFill6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 4. Sfera e Piuma (Aria/Volante) -->
    <radialGradient id="orbTeal6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="65%" stop-color="#164e63" />
      <stop offset="100%" stop-color="#083344" />
    </radialGradient>
    <linearGradient id="featherFill6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- 5. Sfera e Montagna (Terra/Roccia) -->
    <radialGradient id="orbEarth6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="65%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#422006" />
    </radialGradient>
    <linearGradient id="rockLight6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d6b88e" />
    </linearGradient>
    <linearGradient id="rockShade6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4a47c" />
      <stop offset="100%" stop-color="#8c6d46" />
    </linearGradient>

    <!-- 6. Sfera e Luna (Buio/Notte) -->
    <radialGradient id="orbPurple6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="65%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>
    <linearGradient id="moonFill6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#d8b4fe" />
    </linearGradient>

    <!-- 7. Sfera e Anello (Normale/Neutro) -->
    <radialGradient id="orbNeutral6" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#f5f5f4" />
      <stop offset="65%" stop-color="#d6d3d1" />
      <stop offset="100%" stop-color="#a8a29e" />
    </radialGradient>

    <!-- Gemma Cardinale Piccola -->
    <g id="gemCard6">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#bronzeRing6)" stroke="#24130a" stroke-width="1.6" stroke-linejoin="round" />
      <polygon points="0,-18 18,0 0,18 -18,0" fill="none" stroke="#fff3e6" stroke-width="0.8" opacity="0.75" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#07101e" />
      <polygon points="0,-11.5 11.5,0 0,11.5 -11.5,0" fill="#0ea5e9" />
      <polygon points="0,-11.5 11.5,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 11.5,0 0,11.5" fill="#0284c7" />
      <polygon points="0,-5.5 5.5,0 0,5.5 -5.5,0" fill="#e0f2fe" />
    </g>

    <!-- Base Anello Medaglione Singolo -->
    <g id="medallionBase6">
      <circle cx="0" cy="0" r="82" fill="url(#bronzeRing6)" stroke="#1c0f07" stroke-width="2.2" />
      <path d="M -66,-40 A 76,76 0 0,1 66,-40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
      <circle cx="0" cy="0" r="65" fill="#090d14" stroke="#1c0f07" stroke-width="1.8" />
    </g>

    <!-- Quattro Gemme Cardinali per Medaglione -->
    <g id="fourGems6">
      <use href="#gemCard6" x="0" y="-76" />
      <use href="#gemCard6" x="76" y="0" />
      <use href="#gemCard6" x="0" y="76" />
      <use href="#gemCard6" x="-76" y="0" />
    </g>
  </defs>

  <g filter="url(#shadowMosse)">
    <!-- 1. MEDAGLIONE ERBA / FOGLIA -->
    <g transform="translate(110, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbGreen6)" stroke="#4ade80" stroke-width="1.5" />
      <g filter="url(#iconDrop6)">
        <path d="M -22,32 C -26,8 -12,-22 24,-34 C 26,-4 14,24 -18,32 Z" fill="url(#leafFill6)" stroke="#052e16" stroke-width="2" stroke-linejoin="round" />
        <path d="M -24,36 L 16,-20" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" />
      </g>
      <use href="#fourGems6" />
    </g>

    <!-- 2. MEDAGLIONE FUOCO / FIAMMA -->
    <g transform="translate(310, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbRed6)" stroke="#f87171" stroke-width="1.5" />
      <g filter="url(#iconDrop6)">
        <path d="M 0,36 C -24,36 -32,14 -24,-6 C -20,-16 -14,-22 -14,-22 C -14,-12 -8,-8 -6,-12 C -8,-24 -2,-36 4,-40 C 16,-26 30,-4 26,16 C 24,28 12,36 0,36 Z" fill="url(#flameFill6)" stroke="#450a0a" stroke-width="2" stroke-linejoin="round" />
        <path d="M 2,34 C -10,34 -14,20 -8,8 C -4,0 2,-6 4,-12 C 12,-2 16,12 12,24 C 10,30 6,34 2,34 Z" fill="#fef9c3" opacity="0.85" />
      </g>
      <use href="#fourGems6" />
    </g>

    <!-- 3. MEDAGLIONE ACQUA / GOCCIA -->
    <g transform="translate(510, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbBlue6)" stroke="#38bdf8" stroke-width="1.5" />
      <g filter="url(#iconDrop6)">
        <path d="M 0,-38 C 10,-16 28,6 28,20 C 28,35 16,44 0,44 C -16,44 -28,35 -28,20 C -28,6 -10,-16 0,-38 Z" fill="url(#dropFill6)" stroke="#082f49" stroke-width="2" stroke-linejoin="round" />
        <path d="M -16,14 C -18,24 -12,32 -4,35" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85" />
      </g>
      <use href="#fourGems6" />
    </g>

    <!-- 4. MEDAGLIONE ARIA / PIUMA -->
    <g transform="translate(710, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbTeal6)" stroke="#67e8f9" stroke-width="1.5" />
      <g filter="url(#iconDrop6)">
        <path d="M -24,38 L -16,24 C -22,12 -14,-14 26,-36 C 24,-12 14,4 2,12 L 10,12 C 4,20 -4,24 -12,24 L -4,28 C -10,32 -16,32 -18,30 L -24,38 Z" fill="url(#featherFill6)" stroke="#083344" stroke-width="2" stroke-linejoin="round" />
        <path d="M -20,32 L 18,-26" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      </g>
      <use href="#fourGems6" />
    </g>

    <!-- 5. MEDAGLIONE TERRA / MONTAGNA -->
    <g transform="translate(910, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbEarth6)" stroke="#facc15" stroke-width="1.5" />
      <g filter="url(#iconDrop6)" stroke="#291504" stroke-width="2" stroke-linejoin="round">
        <!-- Picco Destro -->
        <polygon points="10,24 24,-6 38,24" fill="url(#rockShade6)" />
        <!-- Picco Sinistro -->
        <polygon points="-38,24 -18,-10 2,24" fill="url(#rockLight6)" />
        <!-- Picco Centrale Principale Sfaccettato -->
        <polygon points="-16,24 4,-34 26,24" fill="url(#rockLight6)" />
        <polygon points="4,-34 26,24 4,24" fill="url(#rockShade6)" />
      </g>
      <use href="#fourGems6" />
    </g>

    <!-- 6. MEDAGLIONE BUIO / LUNA CRESCENTE -->
    <g transform="translate(1110, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbPurple6)" stroke="#e879f9" stroke-width="1.5" />
      <g filter="url(#iconDrop6)">
        <path d="M 14,-32 C -12,-34 -32,-14 -32,10 C -32,34 -12,48 14,40 C 22,37 28,32 32,26 C 14,30 -6,18 -6,-4 C -6,-18 2,-28 14,-32 Z" fill="url(#moonFill6)" stroke="#2e1065" stroke-width="2" stroke-linejoin="round" />
      </g>
      <use href="#fourGems6" />
    </g>

    <!-- 7. MEDAGLIONE NORMALE / NEUTRO -->
    <g transform="translate(1310, 120)">
      <use href="#medallionBase6" />
      <circle cx="0" cy="0" r="60" fill="url(#orbNeutral6)" stroke="#ffffff" stroke-width="1.5" />
      <g filter="url(#iconDrop6)">
        <circle cx="0" cy="0" r="32" fill="#e7e0d6" stroke="#44403c" stroke-width="2" />
        <circle cx="0" cy="0" r="16" fill="#8c8275" stroke="#44403c" stroke-width="1.8" />
      </g>
      <use href="#fourGems6" />
    </g>
  </g>
</svg>