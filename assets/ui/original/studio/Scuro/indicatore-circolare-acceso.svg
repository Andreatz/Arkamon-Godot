<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="shadowIndOn" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Anello in Bronzo / Oro Champagne (da percorso.svg) -->
    <linearGradient id="bronzeRing7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9f2" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Sfera Ciano-Azzurra Brillante 3D -->
    <radialGradient id="cyanSphere7" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="68%" stop-color="#0284c7" />
      <stop offset="92%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
  </defs>

  <g filter="url(#shadowIndOn)" transform="translate(100, 100)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="76" fill="url(#bronzeRing7)" stroke="#1c0f07" stroke-width="2.5" />
    <!-- Riflesso curvo superiore sull'anello -->
    <path d="M -62,-36 A 70,70 0 0,1 62,-36" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- 2. TRINCEA SCURA INCASSATA -->
    <circle cx="0" cy="0" r="61" fill="#050d1a" stroke="#1c0f07" stroke-width="2" />

    <!-- 3. SFERA CENTRALE CIANO-AZZURRA 3D -->
    <circle cx="0" cy="0" r="56" fill="url(#cyanSphere7)" stroke="#0ea5e9" stroke-width="1.5" />
    <!-- Riflesso speculare ovale in alto a sinistra -->
    <ellipse cx="-16" cy="-16" rx="16" ry="10" transform="rotate(-28 -16 -16)" fill="#ffffff" opacity="0.95" />
    <!-- Arco luminoso inferiore -->
    <path d="M -32,38 A 48,48 0 0,0 32,38" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>