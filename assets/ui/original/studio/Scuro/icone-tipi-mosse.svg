<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <filter id="shadowElem" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="symDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeMain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="52%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#5e3a22" />
    </linearGradient>

    <!-- Fascia Ottagonale Blu Ardesia Scuro (da percorso.svg) -->
    <linearGradient id="slateOctagon2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101824" />
      <stop offset="50%" stop-color="#1f2d40" />
      <stop offset="100%" stop-color="#101722" />
    </linearGradient>

    <!-- Gradiente Simboli Centrali in Avorio / Bronzo Chiaro 3D -->
    <linearGradient id="ivorySym2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5ebe0" />
      <stop offset="85%" stop-color="#d6c2a8" />
      <stop offset="100%" stop-color="#9e8264" />
    </linearGradient>

    <linearGradient id="ivorySymShade2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6c2a8" />
      <stop offset="100%" stop-color="#7c5e3f" />
    </linearGradient>

    <!-- 8 Sfere Elementali -->
    <radialGradient id="orbNorm2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#78716c" />
      <stop offset="65%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </radialGradient>
    <radialGradient id="orbElec2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <radialGradient id="orbFire2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="65%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <radialGradient id="orbEarth2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="65%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291002" />
    </radialGradient>
    <radialGradient id="orbWater2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="65%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
    <radialGradient id="orbGrass2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="65%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <radialGradient id="orbDark2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="65%" stop-color="#160724" />
      <stop offset="100%" stop-color="#07020d" />
    </radialGradient>
    <radialGradient id="orbPsy2" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="65%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>

    <clipPath id="innerCircleClip2">
      <circle cx="0" cy="0" r="78" />
    </clipPath>

    <!-- Gemma Cardinale a Diamante (Stile percorso.svg) -->
    <g id="elemGem2">
      <polygon points="0,-27 27,0 0,27 -27,0" fill="url(#bronzeMain2)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-22 22,0 0,22 -22,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-17 17,0 0,17 -17,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#0ea5e9" />
      <polygon points="0,-14 14,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 14,0 0,14" fill="#0284c7" />
      <polygon points="0,-6.5 6.5,0 0,6.5 -6.5,0" fill="#e0f2fe" />
    </g>

    <!-- Cornice Ottagonale Base nello Stile di percorso.svg -->
    <g id="octaElemBase2">
      <!-- Ottagono Esterno in Bronzo -->
      <polygon points="-52,-124 52,-124 124,-52 124,52 52,124 -52,124 -124,52 -124,-52" fill="url(#bronzeMain2)" stroke="#24130a" stroke-width="2.2" stroke-linejoin="round" />
      <polyline points="-50,-120 50,-120 120,-50" fill="none" stroke="#fff3e6" stroke-width="1.5" opacity="0.8" />

      <!-- Fascia Ottagonale Blu Ardesia Scuro -->
      <polygon points="-46,-110 46,-110 110,-46 110,46 46,110 -46,110 -110,46 -110,-46" fill="url(#slateOctagon2)" stroke="#140c07" stroke-width="2" stroke-linejoin="round" />

      <!-- Filetto Interno e Raggi di Sfaccettatura sugli Spigoli -->
      <polygon points="-43,-103 43,-103 103,-43 103,43 43,103 -43,103 -103,43 -103,-43" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0.65" stroke-linejoin="round" />
      <g stroke="#4b657d" stroke-width="1.5" opacity="0.7">
        <line x1="-46" y1="-110" x2="-34" y2="-80" />
        <line x1="46" y1="-110" x2="34" y2="-80" />
        <line x1="110" y1="-46" x2="80" y2="-34" />
        <line x1="110" y1="46" x2="80" y2="34" />
        <line x1="46" y1="110" x2="34" y2="80" />
        <line x1="-46" y1="110" x2="-34" y2="80" />
        <line x1="-110" y1="46" x2="-80" y2="34" />
        <line x1="-110" y1="-46" x2="-80" y2="-34" />
      </g>

      <!-- Anello Circolare Interno in Bronzo Attorno alla Sfera -->
      <circle cx="0" cy="0" r="85" fill="url(#bronzeMain2)" stroke="#24130a" stroke-width="2" />
    </g>

    <!-- Le 4 Gemme Cardinali -->
    <g id="elemFourGems2">
      <use href="#elemGem2" x="0" y="-118" />
      <use href="#elemGem2" x="118" y="0" />
      <use href="#elemGem2" x="0" y="118" />
      <use href="#elemGem2" x="-118" y="0" />
    </g>
  </defs>

  <g filter="url(#shadowElem)">
    <!-- 1. NORMALE -->
    <g transform="translate(165, 170)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbNorm2)" stroke="#140c07" stroke-width="2" />
      <g clip-path="url(#innerCircleClip2)">
        <line x1="-50" y1="-78" x2="30" y2="78" stroke="#ffffff" stroke-width="1.2" opacity="0.06" />
        <path d="M -52,-42 A 70,70 0 0,1 52,-42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25" />
      </g>
      <g filter="url(#symDrop)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round">
        <polygon points="0,-64 16,-16 64,0 16,16 0,64 -16,16 -64,0 -16,-16" fill="url(#ivorySym2)" />
        <polygon points="0,-64 16,-16 0,0" fill="url(#ivorySymShade2)" />
        <polygon points="64,0 16,16 0,0" fill="url(#ivorySymShade2)" />
        <polygon points="0,64 -16,16 0,0" fill="url(#ivorySymShade2)" />
        <polygon points="-64,0 -16,-16 0,0" fill="#ffffff" opacity="0.7" />
        <line x1="0" y1="-64" x2="0" y2="64" />
        <line x1="-64" y1="0" x2="64" y2="0" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 2. ELETTRO -->
    <g transform="translate(455, 170)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbElec2)" stroke="#140c07" stroke-width="2" />
      <path d="M -48,18 A 50,50 0 0,1 -12,-48 M 44,-22 A 50,50 0 0,1 32,42" fill="none" stroke="#fde047" stroke-width="2" opacity="0.5" />
      <g filter="url(#symDrop)">
        <polygon points="22,-60 -36,8 -2,8 -18,62 38,-6 2,-6" fill="url(#ivorySym2)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
        <polygon points="-2,8 -18,62 38,-6 2,-6" fill="url(#ivorySymShade2)" opacity="0.5" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 3. FUOCO -->
    <g transform="translate(745, 170)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbFire2)" stroke="#140c07" stroke-width="2" />
      <path d="M -46,-36 A 56,56 0 0,1 46,-36" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.4" />
      <g filter="url(#symDrop)">
        <path d="M -8,56 C -36,46 -44,14 -32,-12 C -26,-24 -18,-30 -18,-30 C -18,-16 -10,-12 -6,-16 C -12,-36 0,-54 10,-62 C 20,-44 26,-22 18,-2 C 26,-8 30,-16 28,-24 C 42,-8 48,18 36,42 C 28,54 14,58 6,56 C 14,42 16,26 6,14 C 2,26 -4,32 -8,26 C -2,12 -8,-2 -8,-2 C -16,14 -22,28 -14,46 Z" fill="url(#ivorySym2)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 4. TERRA -->
    <g transform="translate(1035, 170)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbEarth2)" stroke="#140c07" stroke-width="2" />
      <g filter="url(#symDrop)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round">
        <!-- Vetta Principale a Chevron -->
        <polygon points="-54,14 -4,-40 24,-10 34,-20 58,8 42,22 24,2 -4,-18 -40,26" fill="url(#ivorySym2)" />
        <polygon points="-4,-40 24,-10 12,2 -4,-18" fill="url(#ivorySymShade2)" />
        <polygon points="34,-20 58,8 42,22 24,2" fill="url(#ivorySymShade2)" />
        <!-- Chevron Inferiore -->
        <polygon points="-42,32 -4,-4 34,32 20,44 -4,20 -28,44" fill="url(#ivorySym2)" />
        <polygon points="-4,-4 34,32 20,44 -4,20" fill="url(#ivorySymShade2)" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 5. ACQUA -->
    <g transform="translate(165, 470)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbWater2)" stroke="#140c07" stroke-width="2" />
      <g filter="url(#symDrop)">
        <path d="M 0,-54 C 12,-24 32,0 32,20 C 32,38 18,50 0,50 C -18,50 -32,38 -32,20 C -32,0 -12,-24 0,-54 Z" transform="translate(0, -10)" fill="url(#ivorySym2)" stroke="#082f49" stroke-width="1.8" stroke-linejoin="round" />
        <!-- Onda Azzurra Sottostante -->
        <path d="M -44,34 C -26,26 -10,36 8,46 C 24,54 36,44 44,30 C 36,54 14,66 -8,52 C -22,42 -34,36 -44,34 Z" fill="#7dd3fc" stroke="#082f49" stroke-width="1.8" stroke-linejoin="round" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 6. ERBA -->
    <g transform="translate(455, 470)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbGrass2)" stroke="#140c07" stroke-width="2" />
      <!-- Foglioline Verdi Laterali -->
      <path d="M -26,38 C -42,28 -48,8 -40,-10 C -28,2 -24,20 -26,38 Z" fill="#22c55e" />
      <path d="M 22,38 C 38,32 46,14 40,-4 C 28,6 22,22 22,38 Z" fill="#22c55e" />
      <!-- Foglia Centrale in Avorio -->
      <g filter="url(#symDrop)">
        <path d="M -18,54 C -24,14 -8,-28 24,-52 C 30,-10 14,32 -18,54 Z" fill="url(#ivorySym2)" stroke="#052e16" stroke-width="2" stroke-linejoin="round" />
        <path d="M -16,50 L 18,-36 M -4,20 L 10,12 M 2,2 L -10,-6" fill="none" stroke="#14532d" stroke-width="3" stroke-linecap="round" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 7. BUIO -->
    <g transform="translate(745, 470)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbDark2)" stroke="#140c07" stroke-width="2" />
      <circle cx="14" cy="0" r="32" fill="none" stroke="#581c87" stroke-width="2.5" opacity="0.6" />
      <g filter="url(#symDrop)">
        <path d="M 16,-48 C -26,-52 -52,-14 -42,26 C -32,62 12,68 40,44 C 10,50 -16,30 -16,-2 C -16,-28 -2,-44 16,-48 Z" fill="url(#ivorySym2)" stroke="#1e1b4b" stroke-width="2" stroke-linejoin="round" />
      </g>
      <use href="#elemFourGems2" />
    </g>

    <!-- 8. PSICO -->
    <g transform="translate(1035, 470)">
      <use href="#octaElemBase2" />
      <circle cx="0" cy="0" r="78" fill="url(#orbPsy2)" stroke="#140c07" stroke-width="2" />
      <g filter="url(#symDrop)" stroke="#2e1065" stroke-width="1.8" stroke-linejoin="round">
        <polygon points="0,-58 -9,-30 9,-30" fill="url(#ivorySym2)" />
        <polygon points="0,58 -9,30 9,30" fill="url(#ivorySym2)" />
        <path fill-rule="evenodd" d="M -62,0 C -32,-38 32,-38 62,0 C 32,38 -32,38 -62,0 Z 
                 M -42,0 C -20,-22 20,-22 42,0 C 20,22 -20,22 -42,0 Z" fill="url(#ivorySym2)" />
        <path d="M 0,0 C 4,-4 9,0 7,5 C 5,12 -5,14 -10,8 C -16,2 -14,-12 -3,-16 C 10,-20 22,-8 20,6 C 18,18 5,24 -8,22" fill="none" stroke="url(#ivorySym2)" stroke-width="6" stroke-linecap="round" />
      </g>
      <use href="#elemFourGems2" />
    </g>
  </g>
</svg>