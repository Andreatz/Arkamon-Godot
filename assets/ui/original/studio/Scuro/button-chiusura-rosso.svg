<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="shadowCloseRed" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <linearGradient id="bronzeRing6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#b07d5b" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Disco Interno Rosso Rubino / Cremisi Scuro -->
    <radialGradient id="crimsonDisc6" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="65%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <linearGradient id="ivoryX6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5ebe0" />
      <stop offset="100%" stop-color="#cbb8a3" />
    </linearGradient>

    <g id="cardinalGem6">
      <polygon points="0,-29 29,0 0,29 -29,0" fill="url(#bronzeRing6)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-24 24,0 0,24 -24,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-19 19,0 0,19 -19,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#0ea5e9" />
      <polygon points="0,-16 16,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 16,0 0,16" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowCloseRed)" transform="translate(140, 140)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="106" fill="url(#bronzeRing6)" stroke="#1c0f07" stroke-width="2.5" />
    <path d="M -86,-52 A 99,99 0 0,1 86,-52" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- 2. TRINCEA SCURA E DISCO INTERNO ROSSO RUBINO -->
    <circle cx="0" cy="0" r="84" fill="#1a0505" stroke="#1c0f07" stroke-width="2" />
    <circle cx="0" cy="0" r="78" fill="url(#crimsonDisc6)" stroke="#f87171" stroke-width="2" stroke-opacity="0.65" />

    <!-- Archi Luminosi Interni -->
    <path d="M -58,-38 A 69,69 0 0,1 58,-38" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M -52,44 A 68,68 0 0,0 52,44" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- 3. ICONA "X" CENTRALE IN AVORIO 3D -->
    <g>
      <path d="M -16,0 L -46,-30 Q -52,-36 -46,-42 L -36,-52 Q -30,-58 -24,-52 L 0,-28 L 24,-52 Q 30,-58 36,-52 L 46,-42 Q 52,-36 46,-30 L 16,0 L 46,30 Q 52,36 46,42 L 36,52 Q 30,58 24,52 L 0,28 L -24,52 Q -30,58 -36,52 L -46,42 Q -52,36 -46,30 Z" transform="translate(0, 5)" fill="#240404" opacity="0.8" />
      <path d="M -16,0 L -46,-30 Q -52,-36 -46,-42 L -36,-52 Q -30,-58 -24,-52 L 0,-28 L 24,-52 Q 30,-58 36,-52 L 46,-42 Q 52,-36 46,-30 L 16,0 L 46,30 Q 52,36 46,42 L 36,52 Q 30,58 24,52 L 0,28 L -24,52 Q -30,58 -36,52 L -46,42 Q -52,36 -46,30 Z" fill="url(#ivoryX6)" stroke="#240808" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M -43,-39 L -33,-49 M 33,-49 L 43,-39" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- 4. QUATTRO GEMME SUI PUNTI CARDINALI -->
    <use href="#cardinalGem6" x="0" y="-98" />
    <use href="#cardinalGem6" x="98" y="0" />
    <use href="#cardinalGem6" x="0" y="98" />
    <use href="#cardinalGem6" x="-98" y="0" />
  </g>
</svg>