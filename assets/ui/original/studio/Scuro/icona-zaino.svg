<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="100%" height="100%">
  <defs>
    <filter id="shadowZaino" x="-12%" y="-10%" width="124%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Bronzo / Oro Rosa (da percorso.svg) -->
    <linearGradient id="bronzeRing5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="82%" stop-color="#c99673" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Disco Interno Blu Ardesia Scuro -->
    <radialGradient id="slateDisc5" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#22354f" />
      <stop offset="65%" stop-color="#121c2b" />
      <stop offset="100%" stop-color="#090e17" />
    </radialGradient>

    <!-- Gradiente Zaino Avorio 3D -->
    <linearGradient id="ivoryBag5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f5ebe0" />
      <stop offset="100%" stop-color="#cbb8a3" />
    </linearGradient>

    <linearGradient id="ivoryBagSide5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6c3af" />
      <stop offset="100%" stop-color="#947e68" />
    </linearGradient>

    <!-- Gemma Cardinale Standard -->
    <g id="cardinalGem5">
      <polygon points="0,-29 29,0 0,29 -29,0" fill="url(#bronzeRing5)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-24 24,0 0,24 -24,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-19 19,0 0,19 -19,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#0ea5e9" />
      <polygon points="0,-16 16,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 16,0 0,16" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>

    <!-- Gemma Inferiore a Lancia (Sud) -->
    <g id="spearGemSouth5">
      <polygon points="0,-29 30,0 0,52 -30,0" fill="url(#bronzeRing5)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,52 -30,0 -18,0 0,24" fill="#fff7ed" opacity="0.55" />
      <polygon points="0,52 30,0 18,0 0,24" fill="#3b2112" opacity="0.7" />
      <polygon points="0,-24 24,0 0,28 -24,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-19 19,0 0,19 -19,0" fill="#07101e" stroke="#1e130c" stroke-width="1" />
      <polygon points="0,-16 16,0 0,16 -16,0" fill="#0ea5e9" />
      <polygon points="0,-16 16,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 16,0 0,16" fill="#0284c7" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowZaino)" transform="translate(140, 140)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="106" fill="url(#bronzeRing5)" stroke="#1c0f07" stroke-width="2.5" />
    <path d="M -86,-52 A 99,99 0 0,1 86,-52" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- 2. TRINCEA SCURA E DISCO INTERNO BLU ARDESIA -->
    <circle cx="0" cy="0" r="84" fill="#070b12" stroke="#1c0f07" stroke-width="2" />
    <circle cx="0" cy="0" r="78" fill="url(#slateDisc5)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.65" />

    <!-- Archi Luminosi Interni -->
    <path d="M -58,-38 A 69,69 0 0,1 58,-38" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <path d="M -52,44 A 68,68 0 0,0 52,44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.45" />

    <!-- 3. ICONA ZAINO / BORSA 3D IN AVORIO -->
    <g>
      <!-- Ombra portata dello zaino -->
      <rect x="-44" y="-22" width="90" height="72" rx="14" transform="translate(0, 6)" fill="#05080f" opacity="0.85" />

      <!-- Manico Superiore -->
      <path d="M -18,-24 L -18,-36 C -18,-45 18,-45 18,-36 L 18,-24" fill="none" stroke="url(#ivoryBag5)" stroke-width="9" stroke-linecap="round" />
      <path d="M -22,-24 L -22,-36 C -22,-49 22,-49 22,-36 L 22,-24 M -14,-24 L -14,-35 C -14,-41 14,-41 14,-35 L 14,-24" fill="none" stroke="#1c110a" stroke-width="2.2" />

      <!-- Fianco Laterale Destro Ombreggiato (Soffietto 3D) -->
      <path d="M 24,-22 L 36,-18 C 44,-2 46,24 44,38 C 42,46 32,48 22,48 Z" fill="url(#ivoryBagSide5)" stroke="#1c110a" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Corpo Anteriore dello Zaino -->
      <path d="M -38,-18 L 28,-18 L 32,36 C 32,44 24,48 14,48 L -30,48 C -40,48 -44,44 -43,36 Z" fill="url(#ivoryBag5)" stroke="#1c110a" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Patta Superiore (Flap) -->
      <path d="M -39,-18 C -39,-24 35,-24 35,-18 L 30,8 C 26,22 -30,22 -35,8 Z" fill="url(#ivoryBag5)" stroke="#1c110a" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Fibbia Centrale -->
      <rect x="-10" y="6" width="18" height="24" rx="4" fill="url(#ivoryBag5)" stroke="#1c110a" stroke-width="2.5" />
      <line x1="-6" y1="10" x2="-6" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 4. GEMME CARDINALI (3 Standard + 1 Punta a Lancia Inferiore) -->
    <use href="#cardinalGem5" x="0" y="-98" />
    <use href="#cardinalGem5" x="98" y="0" />
    <use href="#cardinalGem5" x="-98" y="0" />
    <use href="#spearGemSouth5" x="0" y="98" />
  </g>
</svg>