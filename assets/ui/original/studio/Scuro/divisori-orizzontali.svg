<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <filter id="shadowDiv2" x="-5%" y="-15%" width="110%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Asta in Bronzo / Oro Champagne (da percorso.svg) -->
    <linearGradient id="bronzeBar8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e3a22" />
      <stop offset="18%" stop-color="#fff7ed" />
      <stop offset="42%" stop-color="#e5bfa0" />
      <stop offset="72%" stop-color="#8c5c3e" />
      <stop offset="100%" stop-color="#2e190c" />
    </linearGradient>

    <linearGradient id="bronzeBezel8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="25%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#6e4429" />
      <stop offset="100%" stop-color="#3b2112" />
    </linearGradient>

    <!-- Gemma Centrale Grande -->
    <g id="centerGemLarge8">
      <polygon points="0,-48 48,0 0,48 -48,0" fill="url(#bronzeBezel8)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-48 -48,0 -32,0 0,-32" fill="#fff7ed" opacity="0.65" />
      <polygon points="0,48 48,0 32,0 0,32" fill="#3b2112" opacity="0.65" />
      <polygon points="0,-41 41,0 0,41 -41,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-31 31,0 0,31 -31,0" fill="#07101e" stroke="#1e130c" stroke-width="1.2" />
      <polygon points="0,-28 28,0 0,28 -28,0" fill="#0ea5e9" />
      <polygon points="0,-28 28,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 28,0 0,28" fill="#0284c7" />
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#e0f2fe" />
    </g>

    <!-- Gemma Laterale Media -->
    <g id="sideGemMed8">
      <polygon points="0,-31 31,0 0,31 -31,0" fill="url(#bronzeBezel8)" stroke="#24130a" stroke-width="1.8" stroke-linejoin="round" />
      <polygon points="0,-25 25,0 0,25 -25,0" fill="none" stroke="#fff3e6" stroke-width="0.9" opacity="0.75" />
      <polygon points="0,-20 20,0 0,20 -20,0" fill="#07101e" />
      <polygon points="0,-17 17,0 0,17 -17,0" fill="#0ea5e9" />
      <polygon points="0,-17 17,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 17,0 0,17" fill="#0284c7" />
      <polygon points="0,-8 8,0 0,8 -8,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowDiv2)">
    <!-- 1. DIVISORE SUPERIORE (LUNGO) -->
    <g transform="translate(0, 76)">
      <rect x="52" y="-10" width="816" height="20" fill="url(#bronzeBar8)" stroke="#24130a" stroke-width="2" />
      <line x1="56" y1="-6" x2="864" y2="-6" stroke="#ffffff" stroke-width="1.8" opacity="0.8" />

      <use href="#sideGemMed8" x="52" y="0" />
      <use href="#centerGemLarge8" x="460" y="0" />
      <use href="#sideGemMed8" x="868" y="0" />
    </g>

    <!-- 2. DIVISORE INFERIORE (MEDIO/CORTO) -->
    <g transform="translate(0, 210)">
      <rect x="156" y="-9" width="608" height="18" fill="url(#bronzeBar8)" stroke="#24130a" stroke-width="1.8" />
      <line x1="160" y1="-5" x2="760" y2="-5" stroke="#ffffff" stroke-width="1.6" opacity="0.8" />

      <g transform="translate(156, 0) scale(0.88)">
        <use href="#sideGemMed8" />
      </g>
      <g transform="translate(460, 0) scale(0.88)">
        <use href="#centerGemLarge8" />
      </g>
      <g transform="translate(764, 0) scale(0.88)">
        <use href="#sideGemMed8" />
      </g>
    </g>
  </g>
</svg>