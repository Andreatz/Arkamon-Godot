<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="100%" height="100%">
  <defs>
    <filter id="shadowDiv1" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Gradiente Cilindrico 3D Barra in Bronzo / Oro Champagne (da percorso.svg) -->
    <linearGradient id="bronzeBar7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e3a22" />
      <stop offset="18%" stop-color="#fff7ed" />
      <stop offset="42%" stop-color="#e5bfa0" />
      <stop offset="72%" stop-color="#8c5c3e" />
      <stop offset="100%" stop-color="#2e190c" />
    </linearGradient>

    <!-- Castone in Bronzo Sfaccettato -->
    <linearGradient id="bronzeBezel7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="25%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#6e4429" />
      <stop offset="100%" stop-color="#3b2112" />
    </linearGradient>

    <!-- Gemma Terminale a Diamante -->
    <g id="endGem7">
      <polygon points="0,-46 46,0 0,46 -46,0" fill="url(#bronzeBezel7)" stroke="#24130a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-46 -46,0 -30,0 0,-30" fill="#fff7ed" opacity="0.65" />
      <polygon points="0,46 46,0 30,0 0,30" fill="#3b2112" opacity="0.65" />
      <polygon points="0,-39 39,0 0,39 -39,0" fill="none" stroke="#fff3e6" stroke-width="1" opacity="0.75" />
      <polygon points="0,-30 30,0 0,30 -30,0" fill="#07101e" stroke="#1e130c" stroke-width="1.2" />
      <polygon points="0,-27 27,0 0,27 -27,0" fill="#0ea5e9" />
      <polygon points="0,-27 27,0 0,0" fill="#7dd3fc" />
      <polygon points="0,0 27,0 0,27" fill="#0284c7" />
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#e0f2fe" />
    </g>
  </defs>

  <g filter="url(#shadowDiv1)">
    <!-- 1. ASTA ORIZZONTALE IN BRONZO 3D -->
    <rect x="65" y="59" width="710" height="22" fill="url(#bronzeBar7)" stroke="#24130a" stroke-width="2" />
    <!-- Filetto Speculare Luminoso Lungo l'Asta -->
    <line x1="70" y1="64" x2="770" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- 2. GEMME ALLE ESTREMITÀ SINISTRA E DESTRA -->
    <use href="#endGem7" x="68" y="70" />
    <use href="#endGem7" x="772" y="70" />
  </g>
</svg>