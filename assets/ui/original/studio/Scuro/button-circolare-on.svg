<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="shadowOn" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="cyanRingGlow9" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Anello Esterno in Bronzo / Oro Champagne (Stile percorso.svg) -->
    <linearGradient id="bronzeRing9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9f2" />
      <stop offset="22%" stop-color="#e5bfa0" />
      <stop offset="55%" stop-color="#8c5c3e" />
      <stop offset="85%" stop-color="#b07d5b" />
      <stop offset="100%" stop-color="#472a17" />
    </linearGradient>

    <!-- Fascia Intermedia Blu Ardesia Scuro -->
    <radialGradient id="slateChannel9" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e2d42" />
      <stop offset="70%" stop-color="#0f1724" />
      <stop offset="100%" stop-color="#060a12" />
    </radialGradient>

    <!-- Anello Interno Ciano / Turchese Luminoso (Stato ON) -->
    <linearGradient id="cyanActiveRing9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Sfera Centrale Bianco Perla / Avorio 3D -->
    <radialGradient id="pearlCoreOrb9" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fdf8f0" />
      <stop offset="80%" stop-color="#e2d5c4" />
      <stop offset="100%" stop-color="#a69076" />
    </radialGradient>
  </defs>

  <g filter="url(#shadowOn)" transform="translate(120, 120)">
    <!-- 1. ANELLO ESTERNO IN BRONZO -->
    <circle cx="0" cy="0" r="96" fill="url(#bronzeRing9)" stroke="#1c0f07" stroke-width="2.5" />
    <path d="M -78,-45 A 90,90 0 0,1 78,-45" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

    <!-- 2. FASCIA CIRCOLARE INTERMEDIA BLU ARDESIA -->
    <circle cx="0" cy="0" r="78" fill="url(#slateChannel9)" stroke="#1c0f07" stroke-width="2.2" />

    <!-- 3. ANELLO INTERNO CIANO BRILLANTE CON BAGLIORE -->
    <circle cx="0" cy="0" r="59" fill="url(#cyanActiveRing9)" stroke="#042f2e" stroke-width="2" filter="url(#cyanRingGlow9)" />
    <!-- Riflesso curvo superiore sull'anello ciano -->
    <path d="M -46,-28 A 53,53 0 0,1 46,-28" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- 4. SFERA CENTRALE BIANCO PERLA / AVORIO 3D -->
    <circle cx="0" cy="0" r="43" fill="url(#pearlCoreOrb9)" stroke="#1c110a" stroke-width="2.2" />
    <ellipse cx="-12" cy="-14" rx="14" ry="9" transform="rotate(-25 -12 -14)" fill="#ffffff" opacity="0.85" />
  </g>
</svg>