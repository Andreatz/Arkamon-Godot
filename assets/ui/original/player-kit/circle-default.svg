<svg xmlns="http://www.w3.org/2000/svg" width="272" height="272" viewBox="0 0 272 272" aria-labelledby="title"><title>Ritratto circolare normale — Arkamon</title><desc>Geometrically corrected interpretation of the midnight-blue reference kit. True circles, smooth curves and native gradients. No raster images or traced pixel masks.</desc><defs><radialGradient id="b" cx="42%" cy="32%" r="78%"><stop offset="0%" stop-color="#2d3b58"/><stop offset="38%" stop-color="#222f49"/><stop offset="72%" stop-color="#19243b"/><stop offset="91%" stop-color="#17243d"/><stop offset="100%" stop-color="#1c2d4c"/></radialGradient><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8ca8d3"/><stop offset="12%" stop-color="#6986b7"/><stop offset="35%" stop-color="#3d5c91"/><stop offset="58%" stop-color="#2b4775"/><stop offset="78%" stop-color="#20375f"/><stop offset="94%" stop-color="#385786"/><stop offset="100%" stop-color="#6b87b7"/></linearGradient></defs><circle cx="136" cy="136" r="130" fill="#0b1220"/><circle cx="136" cy="136" r="127" fill="url(#a)"/><circle cx="136" cy="136" r="122" fill="url(#b)"/><circle cx="136" cy="136" r="120" fill="none" stroke="#49658f" stroke-width="1.8" opacity=".6"/></svg>